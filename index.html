<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هندسة الناقة</title>
<meta name="description" content="أطلس تفاعلي ثلاثي الأبعاد للناقة وحيدة السنام: التشريح والحركة والحر والبرد ومراحل العمر والصحة والوقاية.">
<meta name="theme-color" content="#0b1524">
<meta property="og:title" content="هندسة الناقة">
<meta property="og:description" content="جسدٌ صُمِّم للصحراء، من الخُفّ إلى السنام.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --night:#0b1524; --ink:#1b160f;
  --bone:#f3ebdd; --bone-2:rgba(243,235,221,.78); --bone-3:rgba(243,235,221,.56); --bone-4:rgba(243,235,221,.3);
  --hair:rgba(243,235,221,.11); --hair-2:rgba(243,235,221,.2);
  --sand:#dcbf8f; --accent:#46cdb8; --accent-2:#8ae5d6; --accent-soft:rgba(70,205,184,.14); --accent-line:rgba(70,205,184,.45);
  --heat:#f2a14c; --heat-2:#e2622f; --water:#9cc4e8; --fat:#e8c777;
  --ok:#46cdb8; --warn:#f0b34a; --bad:#ef6a4f;
  --pairL:#ffb347; --pairR:#6fd3ff;
  --glass:rgba(11,19,32,.72); --glass-2:rgba(9,15,26,.9); --glass-3:rgba(14,24,40,.55);
  --radius:14px; --topbar:60px; --panel-w:404px;
  --f-ui:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,"Geeza Pro",Arial,system-ui,sans-serif;
  --f-display:"Amiri","Noto Naskh Arabic","Traditional Arabic","Times New Roman",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --ease:cubic-bezier(.22,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--bone);font-family:var(--f-ui);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
html[lang="en"] body{font-size:14.5px;line-height:1.6}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
html[lang="en"] .num{font-family:var(--f-num);letter-spacing:-.01em;font-size:.95em}
kbd{font-family:var(--f-num);font-size:10.5px;line-height:1;direction:ltr;display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border:1px solid var(--hair-2);border-bottom-width:2px;border-radius:5px;color:var(--bone-3)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.latn{font-family:var(--f-ui);direction:ltr;unicode-bidi:isolate}
i.sci{font-family:var(--f-display);font-style:italic;unicode-bidi:isolate}
svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ───────── scene ───────── */
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#gl.dragging{cursor:grabbing}
#callouts{position:fixed;inset:0;pointer-events:none;z-index:3}
#callouts svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.co{position:absolute;pointer-events:auto;transform:translateY(-50%);display:flex;align-items:center;gap:7px;padding:5px 10px 5px 11px;border-radius:999px;
  background:rgba(8,14,24,.74);border:1px solid var(--hair-2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12.5px;white-space:nowrap;color:var(--bone);
  transition:opacity .35s var(--ease),background .2s,border-color .2s;cursor:pointer}
.co:hover,.co.on{background:rgba(14,40,40,.9);border-color:var(--accent-line)}
.co .d{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(70,205,184,.2);flex:none}
.co.hidden{opacity:0;pointer-events:none}
@keyframes coIn{from{opacity:0}to{opacity:1}}
.co{animation:coIn .35s var(--ease)}
.co small{color:var(--bone-3);font-size:11px}
.scrim{position:fixed;inset-inline:0;pointer-events:none;z-index:1}
.scrim.t{top:0;height:140px;background:linear-gradient(to bottom,rgba(8,13,22,.62),rgba(8,13,22,0))}
.scrim.b{bottom:0;height:200px;background:linear-gradient(to top,rgba(8,13,22,.5),rgba(8,13,22,0))}

/* ───────── top bar ───────── */
#topbar{position:fixed;inset-inline:0;top:0;height:calc(var(--topbar) + var(--safe-t));padding:var(--safe-t) max(18px,var(--safe-r)) 0 max(18px,var(--safe-l));display:flex;align-items:center;gap:18px;z-index:10}
.brand{display:flex;align-items:baseline;gap:10px;flex:none;cursor:pointer}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:25px;line-height:1;letter-spacing:0;color:var(--bone);text-shadow:0 1px 18px rgba(0,0,0,.4)}
html[lang="en"] .brand h1{font-family:var(--f-ui);font-weight:600;font-size:17px;letter-spacing:.01em}
.brand .sub{font-size:11.5px;color:var(--bone-3)}
#chapters{display:flex;gap:2px;margin-inline:auto;padding:4px;border-radius:999px;background:rgba(8,14,24,.5);border:1px solid var(--hair);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow-x:auto;scrollbar-width:none}
#chapters::-webkit-scrollbar{display:none}
.chap{padding:6px 13px;border-radius:999px;font-size:13.5px;color:var(--bone-2);white-space:nowrap;transition:background .2s,color .2s}
.chap:hover{color:var(--bone);background:rgba(255,255,255,.05)}
.chap[aria-current="true"]{background:var(--bone);color:var(--ink);font-weight:500}
.tools{display:flex;gap:6px;flex:none}
.tbtn{height:36px;min-width:36px;padding:0 11px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:rgba(8,14,24,.5);border:1px solid var(--hair);font-size:13px;color:var(--bone-2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .2s,color .2s}
.tbtn:hover{color:var(--bone);border-color:var(--hair-2)}
.tbtn.lang{font-weight:500}

/* ───────── chapter panel ───────── */
#panel{position:fixed;z-index:8;top:calc(var(--topbar) + var(--safe-t) + 6px);bottom:16px;inset-inline-start:max(16px,var(--safe-r));width:var(--panel-w);
  display:flex;flex-direction:column;border-radius:18px;background:var(--glass);border:1px solid var(--hair);backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px) saturate(1.15);
  box-shadow:0 20px 60px rgba(0,0,0,.35);transition:transform .45s var(--ease),opacity .35s}
html[dir="ltr"] #panel{inset-inline-start:max(16px,var(--safe-l))}
body.panel-off #panel{transform:translateX(calc(100% + 30px));opacity:0;pointer-events:none}
html[dir="ltr"] body.panel-off #panel{transform:translateX(calc(-100% - 30px))}
#panelToggle{position:fixed;z-index:9;top:calc(var(--topbar) + var(--safe-t) + 18px);inset-inline-start:calc(var(--panel-w) + 26px);transition:inset-inline-start .45s var(--ease)}
body.panel-off #panelToggle{inset-inline-start:16px}
#panelToggle svg{transition:transform .3s}
body.panel-off #panelToggle svg{transform:scaleX(-1)}
.p-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:22px 22px 26px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.p-scroll::-webkit-scrollbar{width:8px}.p-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
.ch-kicker{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--accent-2);letter-spacing:.02em;margin-bottom:6px}
.ch-kicker .n{font-family:var(--f-num);font-size:11px;padding:2px 7px;border:1px solid var(--accent-line);border-radius:999px}
.ch-title{margin:0 0 8px;font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.15}
html[lang="en"] .ch-title{font-family:var(--f-ui);font-weight:600;font-size:26px;letter-spacing:-.01em}
.ch-lede{margin:0 0 18px;color:var(--bone-2);font-size:15px}
.hero-title{font-family:var(--f-display);font-weight:700;font-size:52px;line-height:1.05;margin:4px 0 12px}
html[lang="en"] .hero-title{font-family:var(--f-ui);font-size:36px;letter-spacing:-.02em;font-weight:600}
.hero-hook{font-size:18px;color:var(--bone);margin:0 0 18px;line-height:1.55}
html[lang="en"] .hero-hook{font-size:16px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.btn{height:40px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-size:14px;border:1px solid var(--hair-2);background:rgba(255,255,255,.04);transition:background .2s,border-color .2s}
.btn:hover{background:rgba(255,255,255,.08)}
.btn.primary{background:var(--bone);color:var(--ink);border-color:var(--bone);font-weight:500}
.btn.primary:hover{background:#fff}
.btn.small{height:32px;padding:0 12px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-2)}
.sec-label{font-size:11.5px;color:var(--bone-3);letter-spacing:.04em;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.sec-label::after{content:"";flex:1;height:1px;background:var(--hair)}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--hair)}
.seg button{flex:1 1 auto;min-height:34px;padding:4px 10px;border-radius:9px;font-size:13px;color:var(--bone-2);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--bone)}
.seg button[aria-pressed="true"]{background:rgba(243,235,221,.92);color:var(--ink);font-weight:500}
.seg button small{font-size:10.5px;opacity:.7}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--bone-3);margin:8px 0 0}
.note{font-size:12.5px;color:var(--bone-3);border-inline-start:2px solid var(--hair-2);padding-inline-start:10px;margin:10px 0}
.warnbox{border-radius:12px;padding:11px 13px;background:rgba(240,179,74,.1);border:1px solid rgba(240,179,74,.35);font-size:13px;color:#f7dcae;margin:4px 0 14px;display:flex;gap:10px}
.warnbox svg{color:var(--warn);margin-top:2px}

/* sliders */
.sl{margin:10px 0 4px}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--bone-2);margin-bottom:4px}
.sl-top output{font-weight:600;color:var(--bone)}
input[type=range].rng{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer;--fill:var(--accent);--p:50%}
.rng::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to left,var(--fill) var(--p),rgba(255,255,255,.16) var(--p))}
html[dir="ltr"] .rng::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--fill) var(--p),rgba(255,255,255,.16) var(--p))}
.rng::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.16)}
.rng::-moz-range-progress{height:4px;border-radius:4px;background:var(--fill)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--bone);border:0;margin-top:-7px;box-shadow:0 0 0 4px rgba(0,0,0,.25)}
.rng::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--bone);border:0}
.sl-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--bone-4);margin-top:-2px}

/* topics: progressive disclosure */
.topics{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.topic{border-radius:13px;border:1px solid var(--hair);background:rgba(255,255,255,.025);overflow:hidden;transition:border-color .2s,background .2s}
.topic:hover{border-color:var(--hair-2)}
.topic.open{border-color:var(--accent-line);background:rgba(70,205,184,.05)}
.topic>button{width:100%;display:flex;align-items:flex-start;gap:11px;padding:11px 13px;text-align:start}
.topic .ti{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.05);color:var(--accent-2);flex:none;margin-top:1px}
.topic .tt{flex:1;min-width:0}
.topic .tt b{display:block;font-weight:500;font-size:14.5px;line-height:1.35}
.topic .tt span{display:block;font-size:12.5px;color:var(--bone-3);line-height:1.45;margin-top:2px}
.topic .tt span.flag{display:inline-flex;margin-top:4px}
.topic .chev{margin-top:6px;color:var(--bone-4);transition:transform .25s}
.topic.open .chev{transform:rotate(180deg)}
.topic .body{padding:0 15px 14px;font-size:14px;color:var(--bone-2)}
.topic .body p{margin:0 0 9px}
.topic .body ul{margin:0 0 9px;padding-inline-start:18px}
.topic .body li{margin:2px 0}
.topic .body h4{margin:12px 0 4px;font-size:12px;font-weight:600;color:var(--accent-2);letter-spacing:.02em}
.topic .body .src{font-size:11.5px;color:var(--bone-4);margin-top:8px}
.topic .body .src a{color:var(--bone-3)}
.fig{margin:6px 0 10px;border-radius:10px;background:rgba(0,0,0,.2);border:1px solid var(--hair);padding:8px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:11.5px;color:var(--bone-3);margin-top:4px}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--hair-2);color:var(--bone-2);margin-inline-end:4px;vertical-align:1px}
.flag.z{border-color:rgba(239,106,79,.5);color:#ffb5a3;background:rgba(239,106,79,.1)}
.flag.v{border-color:var(--accent-line);color:var(--accent-2)}
.vet{margin-top:10px;padding:9px 11px;border-radius:10px;background:rgba(70,205,184,.08);border:1px solid var(--accent-line);font-size:13px;color:var(--bone);display:flex;gap:9px}
.zbox{margin:8px 0;padding:9px 11px;border-radius:10px;background:rgba(239,106,79,.08);border:1px solid rgba(239,106,79,.35);font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.filters button{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--hair);color:var(--bone-2)}
.filters button[aria-pressed="true"]{border-color:var(--accent-line);color:var(--accent-2);background:var(--accent-soft)}

/* status light */
.status{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--hair);background:rgba(0,0,0,.2);margin:10px 0}
.status .lamp{display:flex;gap:4px}
.status .lamp i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.12)}
.status[data-l="0"] .lamp i:nth-child(1){background:var(--ok);box-shadow:0 0 10px var(--ok)}
.status[data-l="1"] .lamp i:nth-child(2){background:var(--warn);box-shadow:0 0 10px var(--warn)}
.status[data-l="2"] .lamp i:nth-child(3){background:var(--bad);box-shadow:0 0 10px var(--bad)}
.status b{font-weight:600;font-size:13.5px}
.status span{display:block;font-size:12px;color:var(--bone-3);line-height:1.4}

/* stages, names, teeth, timeline */
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stage{border-radius:12px;border:1px solid var(--hair);padding:9px 6px 8px;text-align:center;background:rgba(255,255,255,.02)}
.stage b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.2}
html[lang="en"] .stage b{font-family:var(--f-ui);font-size:14px;font-weight:600}
.stage span{display:block;font-size:11px;color:var(--bone-3)}
.stage[aria-pressed="true"]{border-color:var(--accent-line);background:var(--accent-soft)}
.names{width:100%;border-collapse:collapse;font-size:13px}
.names td,.names th{padding:6px 4px;border-bottom:1px solid var(--hair);text-align:start;vertical-align:top}
.names th{font-size:11px;color:var(--bone-3);font-weight:500}
.names td:first-child{font-family:var(--f-display);font-size:17px;white-space:nowrap}
.names tr.cur td{background:var(--accent-soft)}
.tl{position:relative;margin:8px 0 6px}
.tl-row{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--hair)}
.tl-row .when{font-size:12px;color:var(--accent-2);font-weight:500}
.tl-row .what{font-size:13px;color:var(--bone-2)}
.tl-row .what b{color:var(--bone);font-weight:500}
.vtable{width:100%;border-collapse:collapse;font-size:12.5px}
.vtable td,.vtable th{padding:7px 4px;border-bottom:1px solid var(--hair);text-align:start;vertical-align:top}
.vtable th{font-size:11px;color:var(--bone-3);font-weight:500}
.vtable td:first-child{font-weight:500;color:var(--bone);white-space:nowrap}
.pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--hair-2);color:var(--bone-3);white-space:nowrap}
.pill.y{border-color:var(--accent-line);color:var(--accent-2)}.pill.n{border-color:rgba(239,106,79,.45);color:#ffb5a3}.pill.m{border-color:rgba(240,179,74,.45);color:#f7dcae}
.srcs{list-style:none;padding:0;margin:0;font-size:13px}
.srcs li{padding:8px 0;border-bottom:1px solid var(--hair);color:var(--bone-2)}
.srcs a{color:var(--bone);text-decoration:none;border-bottom:1px solid var(--hair-2)}
.srcs a:hover{border-color:var(--accent)}
.srcs .tag{font-size:10.5px;color:var(--accent-2);margin-inline-end:6px}

/* gait diagram */
.gait{margin:6px 0 4px}
.gait svg{width:100%;height:auto;display:block}
.gait text{font-size:11px;fill:var(--bone-2);font-family:var(--f-ui)}

/* ───────── dock: day timeline + live readout ───────── */
#dock{position:fixed;z-index:7;bottom:calc(16px + var(--safe-b));inset-inline-end:max(16px,var(--safe-l));inset-inline-start:calc(var(--panel-w) + 32px);display:flex;gap:12px;align-items:flex-end;pointer-events:none;transition:inset-inline-start .45s var(--ease),opacity .35s}
body.panel-off #dock{inset-inline-start:16px}
#dock>*{pointer-events:auto}
.glass{background:var(--glass);border:1px solid var(--hair);border-radius:16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#readout{padding:10px 14px;display:flex;gap:18px;align-items:center;flex:none}
.ro{display:flex;flex-direction:column;line-height:1.2}
.ro .k{font-size:11px;color:var(--bone-3)}
.ro .v{font-size:19px;font-weight:600;margin-top:3px}
.ro .v small{font-size:12px;color:var(--bone-3);font-weight:400;margin-inline-start:2px}
.ro.tb .v{color:var(--heat)}
#dayline{flex:1;min-width:260px;padding:9px 14px 8px;display:flex;align-items:center;gap:12px}
#playBtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--hair-2);display:grid;place-items:center;flex:none}
#playBtn:hover{border-color:var(--bone-3)}
.day-wrap{position:relative;flex:1}
#dayCanvas{display:block;width:100%;height:34px;border-radius:8px}
#day{position:absolute;inset:0;width:100%;height:34px;opacity:0;cursor:pointer;margin:0}
#dayKnob{position:absolute;top:-3px;width:2px;height:40px;background:var(--bone);border-radius:2px;pointer-events:none;box-shadow:0 0 8px rgba(0,0,0,.5)}
#dayKnob::after{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--bone)}
.day-labels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--bone-4);margin-top:2px}
#clock{font-size:15px;font-weight:600;min-width:52px;text-align:center}
body.dock-off #dock{opacity:0;pointer-events:none}
body.dock-off #dock>*{pointer-events:none}

/* inset views (micro-scale) */
#inset{position:fixed;z-index:6;width:250px;inset-inline-end:max(16px,var(--safe-l));top:calc(var(--topbar) + var(--safe-t) + 12px);padding:10px;transition:opacity .3s,transform .3s}
#inset.off{opacity:0;transform:translateY(-8px);pointer-events:none}
#inset .ih{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--bone-2);margin-bottom:6px}
#inset canvas,#inset svg{display:block;width:100%;height:auto;border-radius:10px;background:#1a0d10}
#inset p{margin:6px 0 0;font-size:11.5px;color:var(--bone-3);line-height:1.45}

/* toast */
#toast{position:fixed;z-index:12;left:50%;top:calc(var(--topbar) + var(--safe-t) + 14px);transform:translate(-50%,-8px);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* search palette */
#search{position:fixed;inset:0;z-index:30;background:rgba(4,8,15,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;justify-items:center;align-items:start;padding-top:12vh}
.s-box{width:min(620px,calc(100% - 28px));border-radius:18px;background:var(--glass-2);border:1px solid var(--hair-2);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.s-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--hair)}
.s-in input{flex:1;background:none;border:0;outline:none;font-size:17px;color:var(--bone)}
.s-res{max-height:52vh;overflow-y:auto;padding:6px}
.s-item{display:flex;gap:10px;align-items:center;width:100%;padding:9px 11px;border-radius:10px;text-align:start}
.s-item[aria-selected="true"],.s-item:hover{background:rgba(255,255,255,.07)}
.s-item .k{font-size:11px;color:var(--accent-2);min-width:74px}
.s-item b{font-weight:500;font-size:14px}
.s-item span{font-size:12px;color:var(--bone-3);display:block}
.s-empty{padding:18px;color:var(--bone-3);font-size:13px;text-align:center}

/* tour */
#tour{position:fixed;z-index:20;bottom:calc(20px + var(--safe-b));left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 28px));padding:16px 18px 14px}
#tour .t-step{font-size:11.5px;color:var(--accent-2);margin-bottom:4px;display:flex;justify-content:space-between}
#tour h3{margin:0 0 6px;font-family:var(--f-display);font-size:24px;line-height:1.25}
html[lang="en"] #tour h3{font-family:var(--f-ui);font-size:18px;font-weight:600}
#tour p{margin:0 0 12px;color:var(--bone-2);font-size:14.5px}
#tour .t-bar{height:3px;background:rgba(255,255,255,.1);border-radius:3px;margin-bottom:12px;overflow:hidden}
#tour .t-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s linear}
#tour .row{justify-content:space-between}
body.touring #panel,body.touring #dock,body.touring #panelToggle{opacity:0;pointer-events:none}

/* keyboard help + about modal */
.modal{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:rgba(4,8,15,.5)}
.modal .box{width:min(520px,calc(100% - 28px));max-height:80vh;overflow:auto;padding:18px 20px;border-radius:18px;background:var(--glass-2);border:1px solid var(--hair-2)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px;align-items:center}

/* loader */
#loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 60%,#1b2742,#0b1524 70%);transition:opacity .9s var(--ease)}
#loader.done{opacity:0;pointer-events:none}
.ld{text-align:center;width:min(360px,80vw)}
.ld h2{font-family:var(--f-display);font-size:44px;margin:0 0 6px;font-weight:700}
html[lang="en"] .ld h2{font-family:var(--f-ui);font-size:30px;font-weight:600}
.ld p{color:var(--bone-3);margin:0 0 18px;font-size:14px}
.ld .bar{height:3px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.ld .bar i{display:block;height:100%;width:8%;background:linear-gradient(90deg,var(--sand),var(--heat));transition:width .5s var(--ease)}
.ld .err{color:#ffb5a3;font-size:14px;margin-top:16px}
.caravan{font-size:13px;color:var(--bone-3);margin-top:10px;min-height:1.6em}

/* ───────── responsive ───────── */
@media (max-width:1180px){ :root{--panel-w:360px} .brand .sub{display:none} .chap{padding:6px 10px;font-size:13px} }
@media (max-width:980px){ #readout .ro.opt{display:none} }
@media (max-width:860px) and (min-width:761px){ .tbtn .t{display:none} }
@media (max-width:760px){
  :root{--topbar:52px}
  #topbar{gap:8px;padding-inline:12px;flex-wrap:nowrap}
  .brand h1{font-size:21px}
  #chapters{position:fixed;top:calc(var(--topbar) + var(--safe-t));inset-inline:16px;margin:0;justify-content:flex-start;padding:3px}
  .chap{padding:5px 11px;font-size:13px}
  .tbtn .t{display:none}
  .tbtn{height:34px;min-width:34px;padding:0 9px}
  #panelToggle{display:none}
  #panel{top:auto;bottom:0;inset-inline:0;width:auto;border-radius:20px 20px 0 0;height:var(--sheet-h,42vh);max-height:calc(100% - var(--topbar) - var(--safe-t) - 58px);transition:height .35s var(--ease)}
  body.dragging-sheet #panel{transition:none}
  .p-scroll{padding:6px 16px calc(20px + var(--safe-b))}
  #sheetHandle{display:flex}
  .ch-title{font-size:27px}.hero-title{font-size:38px}.hero-hook{font-size:16px}
  #dock{inset-inline:16px;bottom:calc(var(--sheet-h,42vh) + 8px);flex-direction:column;align-items:stretch;gap:6px}
  body.panel-off #dock{inset-inline-start:16px}
  #readout{gap:12px;padding:7px 11px;justify-content:space-between}
  .ro .v{font-size:16px}
  #dayline{min-width:0;padding:6px 10px}
  #inset{width:180px;top:calc(var(--topbar) + var(--safe-t) + 50px)}
  #tour{bottom:calc(10px + var(--safe-b))}
  .co{font-size:11.5px;padding:4px 8px}
}
@media (min-width:761px){ #sheetHandle{display:none} }
#sheetHandle{justify-content:center;padding:9px 0 4px;cursor:grab;touch-action:none;flex:none}
#sheetHandle i{width:42px;height:5px;border-radius:5px;background:rgba(255,255,255,.28)}
@media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms!important;animation-duration:.01ms!important} }

<script>

    document.querySelector('.ld .bar').hidden = true;

})();
function APP(THREE) {
/* ════════════════════════════════════════════════════════════════
   هندسة الناقة v2 — core: helpers, quality tiers, physiology model, state
   ════════════════════════════════════════════════════════════════ */
'use strict';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

const lerp = (a, b, t) => a + (b - a) * t;

const smooth = (a, b, x) => { const t = inv(a, b, x); return t * t * (3 - 2 * t); };
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
const wrap24 = h => ((h % 24) + 24) % 24;
const wrap1 = x => x - Math.floor(x);
const TAU = Math.PI * 2;

const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));

function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

/* ─────────────────────────── environment & quality tiers ─────────────────────────── */
const ENV = {
  mobile: matchMedia('(max-width: 760px)').matches || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent),
  touch: matchMedia('(pointer: coarse)').matches,

  medium: { name: 'medium', dpr: 1.5, msaa: 4, ssao: true, shells: 7, shadow: 2048, sdf: 1, terrain: .8, bloom: true, plants: .8, dof: true },

function pickTier() {

  if (forced && TIERS[forced]) return forced;
  try { const s = localStorage.getItem('camel-q'); if (s && TIERS[s]) return s; } catch (e) { /* storage blocked */ }

/* ─────────────────────────── physiology model ───────────────────────────
   Body temperature: Schmidt-Nielsen et al. 1957 — watered camels swing ≈2 °C a day;
   camels deprived of water in summer swing > 6 °C (≈34 → >40 °C). Sweating in the
   dehydrated, heterothermic camel starts near 40.5 °C. Air temperatures are an
   illustrative day, not a forecast: summer inland Arabia, and a winter day.        */
const MODEL = {
  mass: 500, cTissue: 3.5, latent: 2400, sweatOnset: 40.5,
  dry(loss) { return smooth(2, 10, loss); },
  heatLoad(season) { return season === 'winter' ? .12 : 1; },
  tMin(s, season) { return lerp(36.2, lerp(36.2, 34.2, this.heatLoad(season)), s); },
  tAmp(s, season) { const w = this.heatLoad(season); return lerp(lerp(.9, 2.0, w), lerp(1.2, 6.5, w), s); },
  bodyShape(h) {

  airShape(h) {

    return x <= 9.5 ? .5 - .5 * Math.cos(Math.PI * x / 9.5) : .5 + .5 * Math.cos(Math.PI * (x - 9.5) / 14.5);
  },
  tb(h, loss, season) { const s = this.dry(loss); return this.tMin(s, season) + this.tAmp(s, season) * this.bodyShape(h); },
  air(h, season) { return season === 'winter' ? 5 + 16 * this.airShape(h) : 26 + 18 * this.airShape(h); },
  sweat(h, loss, season) {

  status(st) {

const AR_D = '٠١٢٣٤٥٦٧٨٩';
let LANG = 'ar';
try { if (localStorage.getItem('camel-lang') === 'en') LANG = 'en'; } catch (e) { /* storage blocked */ }
try { const l = new URLSearchParams(location.search).get('lang'); if (l === 'en' || l === 'ar') LANG = l; } catch (e) { /* no URL */ }

/* ─────────────────────────── state ─────────────────────────── */
const STATE = {
  chapter: 'home',
  hour: 17.2, season: 'summer', playing: false,
  loss: 4, hump: 85,
  stage: 'adult',
  layer: 'skin',             // skin | muscle | organs | skeleton | thermal

      body: L(`<p>كتلة من الدهن والنسيج الضام، لا عظم فيها ولا ماء. تستهلكها الناقة حين يشحّ الغذاء، فيضمر السنام ثم يميل إلى جانب.</p><p>وجمع الدهن فوق الظهر يترك بقية الجسد بلا طبقة عازلة سميكة، فيسهل عليه أن يطرح الحرارة. وحرق الدهن يولّد ماءً فعلًا، لكن التنفّس الإضافي اللازم لحرقه يُفقد ماءً أيضًا، فلا يصلح السنام قِربة.</p>`,

      body: L(`<p>تجترّ الإبل طعامها كالأبقار، لكن معدتها ثلاث حجرات (C1 وC2 وC3) لا أربع، وقد تطوّر الاجترار فيها مستقلًّا عن المجترّات الحقيقية، لذا تُصنَّف في رُتَيبة خاصة: الثفنيّات (Tylopoda).</p><p><b>C1</b> أكبرها، تخمّر فيها الأحياء الدقيقة الألياف، وفي جدارها جيوب غدّية ظُنّت طويلًا خزّاناتٍ للماء، ثم تبيّن أنها ليست كذلك. <b>C3</b> أنبوبية طويلة، وفي خُمسها الأخير تُفرَز الأحماض كما في المعدة الحقيقية.</p>`,

      body: L(`<p>في العطش تسحب الناقة الماء من أنسجتها وتصون حجم بلازما الدم، فيبقى الدم سائلًا يحمل الحرارة إلى الجلد. لذلك تحتمل فقدان نحو ربع وزنها ماءً، بينما تتعرّض ثدييات كثيرة للخطر قبل ذلك بكثير.</p><p>وكرياتها الحمراء بيضاوية لا قرصية، تنتفخ حين تشرب بسرعة ولا تنفجر.</p>`,

    { id: 'nose', icon: 'nose', title: L('الأنف', 'The nose'), sum: L('يستردّ الماء من النَّفَس، ويبرّد الدم الذاهب إلى الدماغ.', 'Wrings water from each breath and cools the blood bound for the brain.'),
      body: L(`<p>في الأنف محارات ملتفّة ذات سطح واسع، تبرّد هواء الزفير وتمتص بخاره، فيخرج أبرد من الجسم وأقل رطوبة. قدّر شميت-نيلسن وزملاؤه (١٩٨١) أن ذلك يوفّر نحو ٦٠٪ من ماء التنفّس، مقارنةً بزفيرٍ مشبع بالبخار على حرارة الجسم.</p><p>والمنخران شقّان تغلقهما عضلات حين يهبّ الرمل.</p>`,

    { id: 'brain', icon: 'brain', title: L('دماغ يبقى أبرد من الجسد', 'A brain kept cooler than the body'), sum: L('شبكة شريانية تبادل الحرارة قبل الدماغ.', 'An arterial network swaps heat before the brain.'),
      body: L(`<p>في قاعدة الجمجمة شبكة دقيقة من الشرايين (الشبكة السباتية) تغمرها أوردة جاءت باردة من الأنف، حيث برّدها التبخّر. تتبادل الحرارة معها، فيصل الدم إلى الدماغ أبرد من دم الجسم.</p><p><b>نقطة خلاف:</b> وجدت دراسة الخواض (١٩٩٢) تبريدًا انتقائيًا للدماغ عند الإبل المعرّضة للحرّ، بينما رأت دراسة أخرى على إبل مُجهَدة حراريًا أن انقباض أوعية الأنف في الحرّ الشديد يحدّ من هذا التبريد. فمقدار فائدته ما زال محلّ نقاش.</p>`,
        `<p>At the base of the skull, a fine meshwork of arteries (the carotid rete) sits bathed in venous blood that has come back cool from the nose, where evaporation chilled it. Heat passes across, so the blood reaching the brain is cooler than the body core.</p><p><b>Not settled:</b> Elkhawad (1992) reported selective brain cooling in heat-exposed camels, while another study of heat-stressed camels argued that constriction of the nasal blood vessels in severe heat limits it. How much it helps is still debated.</p>`),

        `<p>Her kidneys have a deep medulla with long loops that reclaim water, so urine is scant and highly concentrated. The large intestine then wrings the water out of the faeces, and the dung comes out dry.</p>`),

    { id: 'repro', icon: 'uterus', title: L('الرحم والضرع', 'Uterus and udder'), sum: L('رحمٌ ذو قرنين، والحمل غالبًا في الأيسر.', 'A two-horned uterus; pregnancy usually in the left horn.'),
      body: L(`<p>رحم الإبل ذو قرنين، والأيسر أطول. ومع أن الإباضة تحدث من المبيضين كليهما، فإن الغالبية العظمى من حالات الحمل (نحو ٩٥٪ في الإبليات) تستقر في القرن الأيسر. يدوم الحمل نحو ١٣ شهرًا.</p><p>أما الذكر فله «الشقشقة»: امتداد من الحنك الرخو يُخرجه من فمه في موسم الهياج.</p>`,
        `<p>The camel uterus has two horns, the left one longer. Although either ovary can ovulate, the great majority of pregnancies in camelids (about 95%) settle in the left horn. Pregnancy lasts about 13 months.</p><p>The male has the <i>dulla</i>: an extension of the soft palate he pushes out of his mouth during the rut.</p>`),

      body: L(`<p>العنق الطويل لا يحمل فقرات أكثر: سبع فقرات كمعظم الثدييات، لكنها طويلة. تليها ١٢ فقرة صدرية تحمل ١٢ زوجًا من الأضلاع، ثم ٧ قطنية، و٥ عجزية ملتحمة، و١٥ إلى ٢٠ فقرة ذيلية.</p><p>نتوءات الفقرات الصدرية الأولى طويلة وتصنع «الغارب»، أما السنام فلا عظم فيه.</p>`,
        `<p>The long neck does not have more vertebrae: seven, like most mammals — just longer ones. Then 12 thoracic vertebrae carrying 12 pairs of ribs, 7 lumbar, 5 fused sacral and 15–20 in the tail.</p><p>The tall spines of the first thoracic vertebrae make the withers; the hump itself contains no bone.</p>`),

      body: L(`<p>في معظم ذوات الحوافر يصل الجلد والعضل بين البطن والفخذ حتى الركبة. أما الناقة فقوائمها الخلفية متصلة بالجسم من أعلى الفخذ فقط، ولا طيّة جلدية بين البطن والركبة. فيمرّ الهواء تحت بطنها حين تبرك، وتتحرك قوائمها بحرية واسعة.</p><p>وتحت الرسغ والعرقوب لا تكاد توجد عضلات: عظم وأوتار خفيفة، والعضلات مجتمعة في الأعلى.</p>`,
        `<p>In most hoofed animals, skin and muscle join belly and thigh down to the stifle. In the camel the hind legs attach to the body only at the top of the thigh, with no stifle fold — so air can move under her belly when she lies down, and the legs swing freely.</p><p>Below the carpus and hock there is hardly any muscle: light bone and tendon, with the muscles gathered high up.</p>`),

        `<p>After a long thirst a camel may drink about a hundred litres in some ten minutes; 104 litres has been recorded. Most mammals would be harmed by drinking so much at once — the blood is suddenly diluted and red cells swell. Her oval red cells swell and do not burst.</p>`),

      body: L(`<p>معظم الثدييات تحافظ على حرارة ثابتة، فإذا اشتدّ الحرّ تعرّقت، والعرق ماء. الناقة العطشى تسمح لحرارتها أن ترتفع نهارًا من نحو ٣٤° إلى أكثر من ٤٠°، فتخزّن الحرارة في جسدها الكبير، ثم تطرحها ليلًا في الهواء الأبرد دون أن تنفق قطرة. أما المرتوية فلا تتأرجح حرارتها إلا نحو درجتين.</p><p>الحساب في اللوحة تقريبي: ناقة وزنها ٥٠٠ كغ، والسعة الحرارية لأنسجتها نحو ٣٫٥ كيلوجول لكل كغ لكل درجة، وتبخير لتر عرق يطرح نحو ٢٤٠٠ كيلوجول. ارتفاع ٦٫٥ درجات يعني نحو ٤٫٧ لتر عرقٍ لم يُنفَق في يوم.</p>`,
        `<p>Most mammals hold a steady temperature and sweat when it gets hot — and sweat is water. A thirsty camel lets her temperature climb by day from about 34 °C to over 40 °C, banking the heat in her big body, then dumps it at night into cooler air without spending a drop. A watered camel swings only about 2 °C.</p><p>The readout is a rough calculation: a 500 kg camel, tissue heat capacity about 3.5 kJ per kg per °C, and about 2,400 kJ removed per litre of sweat evaporated. A 6.5 °C rise means roughly 4.7 litres of sweat not spent in a day.</p>`),

      body: L(`<p>في تجارب الصيف فقدت إبلٌ حُرمت الماء قرابة ٢٥٪ من وزنها ماءً ثم تعافت بالشرب. سرّ ذلك أنها تسحب الماء من أنسجتها أولًا وتصون بلازما الدم، فيبقى الدم سائلًا.</p><p>حرّك شريط «الماء المفقود»: يتسع تأرجح حرارتها، ويضمر السنام قليلًا، وتنحف خاصرتها.</p>`,
        `<p>In summer trials, camels denied water lost close to 25% of their body weight as water and recovered by drinking. The trick is drawing water from the tissues first while guarding blood plasma, so the blood stays fluid.</p><p>Move the "water lost" slider: her daily temperature swing widens, the hump sags a little, her flanks draw in.</p>`),
      focus: { cam: { t: [0, 1.3, 0], r: 1.5, az: .35, el: .1 }, control: 'loss' }, src: ['sn56'] },
    { id: 'winter', icon: 'snow', title: L('الشتاء والوبر الشتوي', 'Winter and the winter coat'), sum: L('ليالٍ قد تنزل تحت الصفر، ووبر يتبدّل مع الفصول.', 'Nights that can freeze, and a coat that changes with the seasons.'),
      body: L(`<p>ليالي الشتاء في شمال الجزيرة العربية قد تنزل تحت الصفر؛ سُجّلت درجات دون ‎−٥° في مدن مثل عرعر ورفحاء، وأقلّ في القريات. ووبر الإبل يتبدّل مع الفصول: لبصيلات الشعر دورة سنوية (وجدت دراسة أن نشاطها يبلغ أدناه في فبراير ثم يرتفع في الربيع)، وتطرح الإبل وبرها مع الدفء، والنوق وحيدة السنام تطرحه تدريجيًا أكثر من ذوات السنامين.</p><p>الحُوار الصغير والناقة المسنّة أو الهزيلة أقل احتمالًا للبرد والريح والمطر البارد، فتحتاج مأوى من الريح وفراشًا جافًا وغذاءً كافيًا.</p>`,
        `<p>Winter nights in northern Arabia can drop below freezing; readings under −5 °C have been recorded in towns such as Arar and Rafha, and lower still in Qurayyat. The coat changes with the seasons: hair follicles run on a yearly cycle (one study found their activity lowest in February, rising through spring), and camels shed as it warms — dromedaries more gradually than Bactrian camels.</p><p>Young calves and old or thin camels cope less well with cold, wind and cold rain, and need wind shelter, dry bedding and enough feed.</p>`),

    { id: 'heatstress', icon: 'alert', title: L('متى يصبح الحرّ خطرًا؟', 'When heat becomes dangerous'), sum: L('علامات الإجهاد الحراري، وما تفعله.', 'Signs of heat stress, and what to do.'),
      body: L(`<p>الإبل تحتمل الحرّ أكثر من معظم الماشية، لكن الجمع بين الحرّ والعطش والجهد والنقل وغياب الظلّ قد يتجاوز قدرتها. من العلامات: تنفّس سريع يتزايد مع ارتفاع حرارة الجسم، وقلة الأكل، والخمول، والترنّح، ثم الانهيار.</p><p><b>ما تفعله:</b> انقلها إلى الظلّ، وقدّم الماء، وخفّف الحمل والجهد، واتصل بطبيب بيطري فورًا إن ظهرت علامات شديدة.</p>`,
        `<p>Camels tolerate heat better than most livestock, but heat plus thirst plus exertion, transport or no shade can overwhelm them. Signs include fast breathing that climbs with body temperature, going off feed, dullness, staggering, then collapse.</p><p><b>What to do:</b> move her into shade, offer water, cut the load and the work, and call a veterinarian at once if signs are severe.</p>`),

      dx: L('كشط جلدي وفحصه بالمجهر لرؤية السوس أو بيضه.', 'A skin scraping examined under the microscope for mites or eggs.'),
      prev: L('عزل المصاب فورًا، ومعالجة القطيع كله بحسب توجيه الطبيب، وتنظيف الأدوات والأماكن، وفحص الحيوانات الجديدة.', 'Isolate affected animals at once, treat the whole herd as the vet directs, clean equipment and resting places, check new animals.'),
      tx: L('يصف الطبيب مبيدًا للطفيليات الخارجية مناسبًا للإبل، ويكرّر العلاج بفواصل يحدّدها لأن البيض يفقس لاحقًا.', 'The vet prescribes an external antiparasitic suitable for camels and repeats it at intervals they set, since eggs hatch later.'),
      zadv: L('ينتقل إلى الإنسان بالتلامس فيسبب حكّة وطفحًا. البس قفازات وملابس طويلة عند التعامل مع المصاب، واغسل يديك وملابسك، وراجع طبيبًا إن ظهرت حكّة.', 'It can pass to people by contact, causing itching and a rash. Wear gloves and long clothing around affected animals, wash hands and clothes, and see a doctor if you start to itch.'),
      hl: { layer: 'skin', regions: [1, 2, 0, 4, 14, 5, 15, 13] }, src: ['mange'] },
    { id: 'camelpox', sys: ['skin'], zoo: true, vax: true, name: L('جدري الإبل', 'Camelpox'),
      cause: L('فيروس من جنس الفيروسات الجدرية: <i class="sci">Camelpox virus</i> (Orthopoxvirus).', 'An orthopoxvirus: camelpox virus.'),
      spread: L('بالتلامس مع حيوان مصاب أو مع بيئة ملوّثة بقشور البثور وإفرازاتها، ويُشتبه في دور القراد. يزداد غالبًا بعد الأمطار.', 'Contact with infected animals or with an environment contaminated by scabs and secretions; ticks are suspected to play a part. Outbreaks often follow rains.'),
      signs: L('حمّى وتضخّم العقد اللمفاوية، ثم حبوب تصير بثورًا فقشورًا على الشفاه والمنخرين والجفون والرأس، وقد تنتشر في الجسم. أشدّ في الصغار.', 'Fever and swollen lymph nodes, then bumps that become pustules and scabs on the lips, nostrils, eyelids and head, sometimes spreading over the body. Worse in the young.'),
      dx: L('يُشتبه به من العلامات ويؤكّده المختبر (مثل PCR) من عيّنات البثور.', 'Suspected from the signs and confirmed by the laboratory (for example PCR) from lesion samples.'),
      prev: L('التحصين بحسب برنامج الجهة البيطرية (توجد لقاحات حيّة مُضعَفة وأخرى معطّلة)، وعزل المصاب، ومكافحة القراد.', 'Vaccination under the official programme (live attenuated and inactivated vaccines exist), isolating sick animals, tick control.'),
      tx: L('لا علاج نوعي للفيروس؛ يعالج الطبيب الالتهابات البكتيرية الثانوية ويخفّف الأعراض ويرعى الحيوان حتى يتعافى.', 'There is no specific antiviral; the vet treats secondary bacterial infection, eases the signs and supports the animal through recovery.'),
      zadv: L('نادرًا ما يصيب الإنسان، وتكون الإصابة غالبًا بثورًا خفيفة في اليدين والأصابع. البس قفازات عند لمس الآفات، واغسل يديك.', 'Rarely infects people, usually as mild sores on the hands and fingers. Wear gloves when touching lesions and wash your hands.'),
      hl: { layer: 'skin', regions: [11, 10, 1, 2] }, src: ['woahPox', 'cpVax'] },
    { id: 'brucellosis', sys: ['repro'], zoo: true, vax: false, name: L('البروسيلا (الحمّى المالطية)', 'Brucellosis'),
      cause: L('بكتيريا <i class="sci">Brucella melitensis</i> و<i class="sci">Brucella abortus</i>.', 'Bacteria, <i class="sci">Brucella melitensis</i> and <i class="sci">B. abortus</i>.'),
      spread: L('عبر الأجنة المجهضة والمشيمة وإفرازات الولادة والحليب، ومن الأغنام والماعز المصابة التي ترعى مع الإبل.', 'Through aborted fetuses, placentas, birth fluids and milk, and from infected sheep and goats sharing the pasture.'),
      signs: L('كثيرًا ما تكون خفية: إجهاض، واحتباس المشيمة، وضعف الخصوبة، ونقص الحليب.', 'Often subtle: abortion, retained placenta, poor fertility, less milk.'),
      dx: L('اختبارات مصلية للدم (مثل روز بنغال وELISA) وزرع أو PCR من الحليب أو الأنسجة، ضمن برامج الجهات الرسمية.', 'Blood serology (such as Rose Bengal and ELISA), and culture or PCR from milk or tissues, within official programmes.'),
      prev: L('الفحص الدوري وفق البرنامج الرسمي، والنظافة عند الولادة والتخلّص الآمن من الأجنة المجهضة والمشيمة، وفصل الإبل عن القطعان المصابة. لا يوجد لقاح مرخّص خاص بالإبل، واستُخدم لقاح الأغنام Rev.1 أحيانًا دون أدلة كافية على فعاليته فيها.', 'Regular testing under the official programme, hygiene at births and safe disposal of aborted fetuses and placentas, keeping camels away from infected flocks. There is no licensed camel-specific vaccine; the sheep vaccine Rev.1 has occasionally been used in camels without solid evidence of how well it works.'),
      tx: L('تتعامل معه الجهات البيطرية وفق برامج المكافحة الرسمية؛ علاج الحيوان المصاب غير مجدٍ في الغالب ويقرّره الطبيب البيطري.', 'Veterinary authorities handle it under official control programmes; treating infected animals is usually not worthwhile, and the decision rests with the veterinarian.'),
      zadv: L('من أهم الأمراض المشتركة في المنطقة، وحليب الإبل النيء مصدر رئيسي للعدوى. اغلِ الحليب أو اشربه مبستَرًا، والبس قفازات عند التوليد أو لمس الأجنة المجهضة، وراجع طبيبًا إذا أصابتك حمّى متكررة وآلام مفاصل.', 'One of the region’s most important zoonoses, and raw camel milk is a major source. Boil milk or drink it pasteurised, wear gloves when assisting births or touching aborted material, and see a doctor for recurring fever and joint pain.'),
      hl: { layer: 'organs', organs: ['uterus'], regions: [9] }, src: ['bruc', 'rev1', 'zoon'] },
    { id: 'mers', sys: ['resp'], zoo: true, vax: false, name: L('متلازمة الشرق الأوسط التنفسية (كورونا الإبل)', 'MERS-CoV'),
      cause: L('فيروس كورونا المسبّب لمتلازمة الشرق الأوسط التنفسية (MERS-CoV). الإبل وحيدة السنام مستودعه الحيواني الرئيسي.', 'The Middle East respiratory syndrome coronavirus. Dromedary camels are its main animal reservoir.'),
      spread: L('بين الإبل عبر إفرازات الأنف والتنفّس، وتنتشر الإصابة خاصةً بين الصغار.', 'Between camels through nasal and respiratory secretions; infection is especially common in young camels.'),
      signs: L('في الإبل خفيفة أو غائبة غالبًا: سيلان أنفي خفيف أحيانًا عند الصغار.', 'Usually mild or absent in camels: sometimes a slight runny nose in the young.'),
      dx: L('PCR لمسحات الأنف، واختبارات الأجسام المضادة في الدم.', 'PCR on nasal swabs, and antibody tests on blood.'),
      prev: L('النظافة وتقليل الازدحام. لا يوجد حتى 2025 لقاح مرخّص للإبل؛ هناك لقاحات تجريبية دُرست فيها.', 'Hygiene and less crowding. As of 2025 there is no licensed camel vaccine; candidate vaccines have been tested in camels.'),
      tx: L('لا علاج نوعي في الإبل؛ يرعى الطبيب الحيوان ويبلّغ الجهات المختصة إذا لزم.', 'No specific treatment in camels; the vet supports the animal and informs the authorities where required.'),
      zadv: L('بحسب منظمة الصحة العالمية: اغسل يديك قبل لمس الإبل وبعده، وتجنّب ملامسة الإبل المريضة، ولا تشرب حليب الإبل نيئًا ولا بولها، ولا تأكل لحمًا غير مطبوخ جيدًا. ومن لديه سكري أو فشل كلوي أو مرض رئوي مزمن أو ضعف مناعة فليتجنّب مخالطة الإبل.', 'WHO advice: wash your hands before and after touching camels, avoid contact with sick animals, do not drink raw camel milk or camel urine, and do not eat undercooked meat. People with diabetes, kidney failure, chronic lung disease or weak immunity should avoid contact with camels.'),
      hl: { layer: 'organs', organs: ['turbinates', 'trachea', 'lungL', 'lungR'], regions: [11] }, src: ['mersWHO', 'mersVax'] },
    { id: 'parasites', sys: ['gut', 'blood'], zoo: false, vax: false, name: L('الديدان الداخلية', 'Internal parasites'),
      cause: L('ديدان أسطوانية معوية، أخطرها <i class="sci">Haemonchus longistipes</i> الماصّة للدم.', 'Gut roundworms, the most harmful being the blood-sucking <i class="sci">Haemonchus longistipes</i>.'),
      spread: L('تبتلع الإبل اليرقات مع المرعى أو الماء الملوّث بالروث.', 'Camels swallow larvae with pasture or water contaminated by dung.'),
      signs: L('فقر دم وشحوب الأغشية، وهزال وضمور السنام، وإسهال أحيانًا، وتورّم تحت الفكّ في الحالات الشديدة، وبطء نمو الصغار.', 'Anaemia and pale membranes, wasting with a shrinking hump, sometimes diarrhoea, swelling under the jaw in heavy cases, poor growth in the young.'),
      dx: L('عدّ البيض في الروث بالمختبر.', 'Faecal egg counts in the laboratory.'),
      prev: L('تطهير موجَّه بإشراف الطبيب وبحسب نتائج فحص الروث، لا بشكل عشوائي، لأن مقاومة الديدان للأدوية في ازدياد. ونظافة المعالف والمشارب، وإدارة المرعى.', 'Targeted deworming guided by the vet and faecal tests, not blanket dosing, because drug resistance is rising. Clean feeders and troughs, manage pasture.'),
      tx: L('يختار الطبيب الدواء والجرعة ويعيد الفحص للتأكّد من نجاح العلاج.', 'The vet chooses the drug and dose and re-tests to confirm it worked.'),
      hl: { layer: 'organs', organs: ['c3', 'intestine', 'colon'] }, src: ['haem', 'resist'] },
    { id: 'ticks', sys: ['skin', 'blood'], zoo: true, vax: false, name: L('القراد', 'Ticks'),
      cause: L('قراد صلب، أشهره في الإبل <i class="sci">Hyalomma dromedarii</i>.', 'Hard ticks, most famously <i class="sci">Hyalomma dromedarii</i> in camels.'),
      spread: L('في المراح والمرعى، ويتعلّق بالمناطق الرقيقة: حول الشرج والضرع والأذنين وبين القوائم.', 'In pens and pasture; it attaches to thin-skinned areas around the tail, udder, ears and between the legs.'),
      signs: L('تهيّج وجروح، وفقر دم مع الإصابة الكثيفة، وقد ينقل أمراضًا.', 'Irritation and wounds, anaemia with heavy loads; ticks can carry disease.'),
      dx: L('الفحص المباشر للجلد.', 'Checking the skin directly.'),
      prev: L('فحص الإبل دوريًا، ونظافة المراح، ومكافحة القراد ببرنامج يوجّهه الطبيب.', 'Regular checks, clean pens, tick control on a programme the vet sets.'),
      tx: L('يختار الطبيب مبيد القراد المناسب وطريقة استخدامه، ويعالج الجروح.', 'The vet chooses a suitable acaricide and how to use it, and treats wounds.'),
      zadv: L('قراد الهيالوما يمكن أن ينقل حمّى القرم-الكونغو النزفية إلى الإنسان، بلدغته أو بدم الحيوانات المصابة. لا تسحق القراد بيدك العارية، والبس قفازات وملابس طويلة، واحذر من الدم عند الذبح، وراجع طبيبًا فورًا إذا أصابتك حمّى بعد لدغة.', 'Hyalomma ticks can pass Crimean-Congo haemorrhagic fever to people, by bite or through the blood of infected animals. Never crush ticks with bare hands, wear gloves and long clothing, take care with blood at slaughter, and see a doctor at once if you get a fever after a bite.'),
      hl: { layer: 'skin', regions: [9, 12, 8, 13] }, src: ['cchf'] },
    { id: 'mastitis', sys: ['repro'], zoo: false, vax: false, name: L('التهاب الضرع', 'Mastitis'),
      cause: L('بكتيريا تدخل من فتحة الحلمة، مثل المكوّرات العنقودية والعقدية.', 'Bacteria entering through the teat canal, such as staphylococci and streptococci.'),
      spread: L('ضعف نظافة الحلب، وجروح الحلمات، وتلوّث الأيدي والأدوات والأرض.', 'Poor milking hygiene, teat injuries, contaminated hands, equipment and ground.'),
      signs: L('ربع أو أكثر من الضرع متورّم ساخن مؤلم، وحليب متغيّر بخثرات أو دم، وقد تحدث حمّى.', 'One or more quarters swollen, hot and painful; milk with clots or blood; sometimes fever.'),
      dx: L('فحص الضرع والحليب، واختبار كاليفورنيا للتهاب الضرع، وزرع الحليب لتحديد البكتيريا.', 'Examining udder and milk, the California Mastitis Test, and milk culture to identify the bacteria.'),
      prev: L('نظافة اليدين والأدوات، والحلب بلطف، والعناية بالحلمات، ومعالجة الحالات مبكرًا.', 'Clean hands and equipment, gentle milking, teat care, treating cases early.'),
      tx: L('يعالج الطبيب بحسب نتيجة الزرع، ويحدّد مدة التخلّص من الحليب بعد العلاج.', 'The vet treats according to the culture result and sets how long milk must be discarded after treatment.'),
      hl: { layer: 'skin', regions: [9] }, src: ['mastitis', 'welfare'] },
    { id: 'calfDiarrhea', sys: ['gut'], zoo: true, vax: false, name: L('إسهال المواليد', 'Calf diarrhoea'),
      cause: L('بكتيريا مثل الإشريكية القولونية، وفيروسات مثل الروتا والكورونا، وطفيلي الكريبتوسبوريديوم، وتزيدها قلة اللبأ.', 'Bacteria such as <i class="sci">E. coli</i>, viruses such as rotavirus and coronavirus, and <i class="sci">Cryptosporidium</i> — made worse when the calf missed colostrum.'),
      spread: L('من الروث الملوّث في مكان الولادة والرضاعة.', 'From contaminated dung around the calving and suckling area.'),
      signs: L('إسهال، وجفاف مع عيون غائرة وجلد يبقى مقروصًا، وضعف وعزوف عن الرضاعة.', 'Diarrhoea, dehydration with sunken eyes and a skin fold that stays up, weakness, refusing to suckle.'),
      dx: L('فحص الطبيب، وتحاليل الروث لتحديد المسبّب.', 'The vet’s examination, and dung tests to find the cause.'),
      prev: L('أن يرضع الحُوار اللبأ في الساعات الأولى، ومكان ولادة نظيف وجاف، ونظافة الأيدي والأدوات، وتحصين الأمّهات إن أوصى به الطبيب.', 'Colostrum in the first hours, a clean dry calving area, clean hands and equipment, vaccinating dams if the vet advises it.'),
      tx: L('الخطر الأكبر هو الجفاف: يعوّض الطبيب السوائل والأملاح (فمويًا أو وريديًا) ويعالج المسبّب إن لزم.', 'Dehydration is the main danger: the vet replaces fluids and salts (by mouth or drip) and treats the cause if needed.'),
      zadv: L('بعض المسبّبات مثل الكريبتوسبوريديوم والسالمونيلا تصيب الإنسان. اغسل يديك جيدًا بعد التعامل مع الحوار المريض وروثه.', 'Some causes, such as Cryptosporidium and Salmonella, infect people. Wash your hands well after handling a sick calf or its dung.'),
      hl: { layer: 'organs', organs: ['intestine', 'colon'] }, src: ['calfD', 'orphan'] },
    { id: 'respiratory', sys: ['resp'], zoo: false, vax: true, name: L('أمراض الجهاز التنفسي', 'Respiratory disease'),
      cause: L('بكتيريا مثل الباستوريلا والمانهيميا، وفيروسات، ويزيدها الإجهاد والغبار والازدحام والنقل.', 'Bacteria such as Pasteurella and Mannheimia, and viruses, worsened by stress, dust, crowding and transport.'),
      spread: L('بالرذاذ والتلامس، وتنشط في الحيوانات المُجهَدة.', 'By droplets and contact, flaring in stressed animals.'),
      signs: L('سعال، وسيلان أنفي، وحمّى، وتنفّس سريع، وقلة أكل.', 'Cough, nasal discharge, fever, fast breathing, poor appetite.'),
      dx: L('الفحص السريري، ومسحات وتحاليل، وأحيانًا تصوير بالموجات فوق الصوتية.', 'Clinical examination, swabs and tests, sometimes ultrasound.'),
      prev: L('تقليل الإجهاد والازدحام، وتهوية جيدة، والتحصين ضد الباستوريلا حيث توصي به الجهات البيطرية.', 'Less stress and crowding, good ventilation, vaccination against Pasteurella where the veterinary authorities recommend it.'),
      tx: L('يحدّد الطبيب العلاج بحسب المسبّب والشدّة.', 'The vet decides treatment by cause and severity.'),
      hl: { layer: 'organs', organs: ['lungL', 'lungR', 'trachea', 'turbinates'] }, src: ['pasteur'] },
    { id: 'foot', sys: ['move'], zoo: false, vax: false, name: L('إصابات الخفّ والوسادة', 'Foot and pad injuries'),
      cause: L('أشواك ومسامير وزجاج وحجارة حادة، وتمزّق الوسادة، وتقرّحها، وخراجات، وتشقّقات، وطول الأظافر.', 'Thorns, nails, glass and sharp stones; torn or ulcerated pads, abscesses, cracks, overgrown nails.'),
      spread: L('لا تنتقل، لكن تكثر مع الأرض الصلبة أو الملوّثة، والعمل، والوقوف الطويل. والقوائم الأمامية أكثر عرضة لأنها تحمل معظم الوزن.', 'Not contagious, but more common on hard or littered ground, with work, and with long standing. Front feet suffer more because they carry most of the weight.'),
      signs: L('عرج، وعزوف عن الحركة، وتورّم أو سخونة، ورائحة كريهة أو إفرازات من جرح.', 'Lameness, reluctance to move, swelling or heat, a foul smell or discharge from a wound.'),
      dx: L('فحص القدم، والتصوير الشعاعي عند الحاجة.', 'Examining the foot, and X-rays when needed.'),
      prev: L('مراحات وممرات نظيفة من الأجسام الحادة، وفحص الأقدام بانتظام، وتقليم الأظافر الطويلة بيد خبيرة.', 'Pens and paths clear of sharp objects, regular foot checks, overgrown nails trimmed by an experienced hand.'),
      tx: L('ينظّف الطبيب الجرح ويصرّف الخراج ويحمي القدم بضماد أو غطاء، ويقرّر أي دواء.', 'The vet cleans the wound, drains abscesses, protects the foot with a dressing or boot, and decides on any medicine.'),
      hl: { layer: 'skin', regions: [6, 16, 7, 17] }, src: ['footLes'] },
    { id: 'dental', sys: ['move'], zoo: false, vax: false, name: L('مشكلات الأسنان', 'Dental problems'),
      cause: L('تآكل مع العمر، وكسور، وسوء إطباق، وبقاء أسنان لبنية، وخراجات الجذور. وأنياب الذكور قد تسبّب جروحًا في العراك.', 'Wear with age, fractures, malocclusion, retained milk teeth, root abscesses. Males’ canines can cause wounds in fights.'),
      spread: L('لا تنتقل. تزداد مع التقدّم في العمر.', 'Not contagious. Increase with age.'),
      signs: L('صعوبة المضغ وإسقاط الطعام، وهزال، وسيلان لعاب، وتورّم الفكّ، ورائحة كريهة.', 'Difficulty chewing and dropping food, weight loss, drooling, jaw swelling, bad smell.'),
      dx: L('فحص الفم (غالبًا مع تهدئة الحيوان) والتصوير الشعاعي.', 'Examining the mouth (usually with sedation) and X-rays.'),
      prev: L('فحص الأسنان دوريًا خاصةً للمسنّة، وعلف مناسب.', 'Regular dental checks, especially in old camels, and suitable feed.'),
      tx: L('إجراءات أسنان يقوم بها الطبيب البيطري، مثل البرد أو الخلع أو علاج الخراج.', 'Dental procedures by the vet, such as rasping, extraction or treating abscesses.'),
      hl: { layer: 'skin', regions: [11, 1] }, src: ['dental'] },
    { id: 'heatStress', sys: ['blood'], zoo: false, vax: false, name: L('الإجهاد الحراري', 'Heat stress'),
      cause: L('حمل حراري يفوق قدرتها: حرّ مع عطش، أو جهد، أو نقل، أو غياب الظلّ.', 'A heat load beyond what she can shed: heat with thirst, exertion, transport, or no shade.'),
      spread: L('لا ينتقل. الحُوار والمسنّة والمريضة أكثر عرضة.', 'Not contagious. Calves, old and sick camels are most at risk.'),
      signs: L('تنفّس سريع متزايد، وقلة أكل، وخمول، ولعاب، وترنّح، ثم انهيار.', 'Fast, rising breathing rate, going off feed, dullness, drooling, staggering, then collapse.'),

/* ─────────── sky: palette by time of day, screen backdrop, PMREM environment ─────────── */
const SKY_GLSL = `
  uniform vec3 uTop, uHor, uLow, uSunCol, uSunDir, uGround;
  uniform float uSunI, uNight, uStorm, uThermal;
  vec3 skyRad(vec3 d){
    float e = d.y;
    vec3 c = mix(uHor, uTop, smoothstep(0.0, 0.55, e));
    c = mix(c, uLow, smoothstep(0.0, -0.25, e));
    float sd = max(dot(d, uSunDir), 0.0);
    c += uSunCol * (pow(sd, 8.0) * 0.35 + pow(sd, 64.0) * 0.8) * uSunI;

  const u = {
    uTop: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uLow: { value: new THREE.Color() }, uGround: { value: new THREE.Color() },
    uSunCol: { value: new THREE.Color() }, uSunDir: { value: new V3(0, 1, 0) }, uSunI: { value: 1 }, uNight: { value: 0 }, uStorm: { value: 0 }, uThermal: { value: 0 },
    uHaze: { value: new THREE.Color() }, uAspect: { value: 1 }, uTime: { value: 0 }, uAz: { value: 0 }, uStars: { value: 0 },
    uCamInvView: { value: new THREE.Matrix4() }, uProjInv: { value: new THREE.Matrix4() },
  };
  // screen-space backdrop: the diorama floats in a cyclorama that carries the real sky direction
  const back = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
    uniforms: u, depthTest: false, depthWrite: false,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 1.0, 1.0); }`,
    fragmentShader: `varying vec2 vUv; ${SKY_GLSL} uniform vec3 uHaze; uniform float uAspect, uTime, uAz, uStars; uniform mat4 uCamInvView, uProjInv;
      ${GLSL_COMMON}
      float h31(vec3 p){ p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
      float starField(vec3 d){

        vec3 d = normalize((uCamInvView * vec4(v.xyz, 0.0)).xyz);

        vec3 dn = normalize(vec3(d.x, max(d.y, 0.0), d.z));

  }));

  const envScene = new THREE.Scene();
  const dome = new THREE.Mesh(new THREE.SphereGeometry(50, 48, 24), new THREE.ShaderMaterial({
    uniforms: u, side: THREE.BackSide, depthWrite: false,
    vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `varying vec3 vD; ${SKY_GLSL}
      void main(){ vec3 d = normalize(vD); vec3 c = skyRad(d);
        vec3 gr = uGround * (0.15 + 0.85 * max(uSunDir.y, 0.0)) * (0.6 + uSunI * 0.4);

        gl_FragColor = vec4(c, 1.0); }`,
  }));

    u, back, envScene,
    updateEnv(key, force) {
      if (!force && key === lastKey) return;
      lastKey = key;
      const rt = pmrem.fromScene(envScene, 0.02, 0.1, 100);
      if (envRT) envRT.dispose();
      envRT = rt;
      scene.environment = rt.texture;
    },

}

/* ─────────── camera rig with auto-fit into the free part of the screen ─────────── */
class Rig {
  constructor(cam, el) {
    this.cam = cam; this.el = el;
    this.target = new V3(0, 1, 1.9); this.r = 9; this.theta = -.55; this.phi = 1.2;
    this.v = { th: 0, ph: 0 }; this.fly = null; this.ptrs = new Map(); this.moved = 0;
    this.limits = { rMin: .9, rMax: 20, phMin: .14, phMax: 1.56 };
    this.follow = null; this.onTap = null; this.userMoved = 0;
    el.addEventListener('pointerdown', e => this.down(e));
    el.addEventListener('pointermove', e => this.move(e));
    el.addEventListener('pointerup', e => this.up(e));
    el.addEventListener('pointercancel', e => this.up(e));
    el.addEventListener('wheel', e => { e.preventDefault(); this.fly = null; this.userMoved = performance.now(); this.r = clamp(this.r * Math.exp(e.deltaY * .0011), this.limits.rMin, this.limits.rMax); }, { passive: false });
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  down(e) {
    try { this.el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    this.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    this.moved = 0; this.pan = e.button === 2 || e.shiftKey; this.pinch0 = null;
    this.el.classList.add('dragging');
  }
  move(e) {
    const p = this.ptrs.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    this.moved += Math.abs(dx) + Math.abs(dy);
    if (this.moved > 4) { this.fly = null; this.userMoved = performance.now(); }
    if (this.ptrs.size === 2) {
      const [a, b] = [...this.ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (this.pinch0) { this.r = clamp(this.r * this.pinch0 / Math.max(d, 1), this.limits.rMin, this.limits.rMax); this.panBy(dx * .5, dy * .5); }
      this.pinch0 = d; return;
    }
    if (this.pan) { this.panBy(dx, dy); return; }
    this.v.th = -dx * .006; this.v.ph = -dy * .006;
    this.theta += this.v.th; this.phi = clamp(this.phi + this.v.ph, this.limits.phMin, this.limits.phMax);
  }
  up(e) {
    const p = this.ptrs.get(e.pointerId); this.ptrs.delete(e.pointerId);
    if (this.ptrs.size < 2) this.pinch0 = null;
    if (!this.ptrs.size) this.el.classList.remove('dragging');
    if (p && this.moved < 6 && this.onTap && e.type === 'pointerup') this.onTap(e);
  }
  panBy(dx, dy) {
    const s = 2 * this.r * Math.tan(this.cam.fov * DEG / 2) / (this.el.clientHeight || 800);
    const right = new V3().setFromMatrixColumn(this.cam.matrixWorld, 0), up = new V3().setFromMatrixColumn(this.cam.matrixWorld, 1);
    this.target.addScaledVector(right, -dx * s).addScaledVector(up, dy * s);
    const xz = Math.hypot(this.target.x, this.target.z);
    if (xz > 4.2) { this.target.x *= 4.2 / xz; this.target.z *= 4.2 / xz; }
    this.target.y = clamp(this.target.y, .05, 3);
  }
  flyTo(goal, dur = 1.6) {
    let dth = goal.theta - this.theta; dth = ((dth + Math.PI) % TAU + TAU) % TAU - Math.PI;
    this.fly = { t: 0, dur: ENV.reduce ? .001 : dur, from: this.state, to: { target: goal.target.clone(), r: goal.r, theta: this.theta + dth, phi: goal.phi } };
    this.v.th = this.v.ph = 0;
  }
  get state() { return { target: this.target.clone(), r: this.r, theta: this.theta, phi: this.phi }; }
  update(dt) {
    if (this.fly) {
      const f = this.fly; f.t = Math.min(1, f.t + dt / f.dur);
      const e = easeInOut(f.t);
      this.target.lerpVectors(f.from.target, f.to.target, e);
      this.r = lerp(f.from.r, f.to.r, e) + Math.sin(Math.PI * e) * Math.min(1.1, Math.abs(f.to.r - f.from.r) * .12 + .15);
      this.theta = lerp(f.from.theta, f.to.theta, e); this.phi = lerp(f.from.phi, f.to.phi, e);
      if (f.t >= 1) this.fly = null;
    } else if (!this.ptrs.size) {
      const damp = Math.pow(.0009, dt);
      this.v.th *= damp; this.v.ph *= damp;
      if (Math.abs(this.v.th) > 1e-5 || Math.abs(this.v.ph) > 1e-5) { this.theta += this.v.th; this.phi = clamp(this.phi + this.v.ph, this.limits.phMin, this.limits.phMax); }

    const sp = Math.sin(this.phi);
    this.cam.position.set(this.target.x + this.r * sp * Math.sin(this.theta), this.target.y + this.r * Math.cos(this.phi), this.target.z + this.r * sp * Math.cos(this.theta));

  }
  /* distance at which a set of world points fits inside a screen rectangle (px), for a given orientation */
  fitDistance(points, rect, theta, phi, target, pad = 24) {
    const cam = this.cam.clone(), W = innerWidth, H = innerHeight;
    cam.aspect = W / H; cam.clearViewOffset(); cam.updateProjectionMatrix();
    const need = { w: Math.max(40, rect.w - 2 * pad), h: Math.max(40, rect.h - 2 * pad) };
    let lo = .6, hi = 40;
    for (let it = 0; it < 22; it++) {
      const r = (lo + hi) / 2, sp = Math.sin(phi);
      cam.position.set(target.x + r * sp * Math.sin(theta), target.y + r * Math.cos(phi), target.z + r * sp * Math.cos(theta));
      cam.lookAt(target); cam.updateMatrixWorld();
      let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, behind = false;
      for (const p of points) {
        const v = p.clone().applyMatrix4(cam.matrixWorldInverse); if (v.z > -.05) { behind = true; break; }
        v.applyMatrix4(cam.projectionMatrix);
        x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y);
      }
      const w = (x1 - x0) / 2 * W, h = (y1 - y0) / 2 * H;
      if (behind || w > need.w || h > need.h) lo = r; else hi = r;
    }
    return hi;
  }
}

/* ════════════════════════════════════════════════════════════════
   the desert: dunes to the horizon, wind ripples, a footprint map,
   arfaj and acacia, grass tufts, stones, distant buttes, dust
   ════════════════════════════════════════════════════════════════ */
const PLAY_R = 7.5;          // the flat sand where she walks
function terrainH(x, z) {
  const r = Math.hypot(x, z);
  let h = 0.035 * fbm(x * .45 + 7.1, z * .45 - 2.3, 3) + 0.012 * vnoise(x * 1.9, z * 1.9);
  const w = smooth(PLAY_R + .5, 26, r);
  if (w > 0) {
    // long linear dunes aligned roughly with the wind, crests wandering
    const a = 18 * DEG, u = x * Math.cos(a) + z * Math.sin(a), v = -x * Math.sin(a) + z * Math.cos(a);
    const crest = u + 7 * Math.sin(v * .041) + 2.6 * Math.sin(v * .13 + 1.7);
    const P = 46, t = wrap1(crest / P + .23), ap = .7;
    const prof = t < ap ? Math.pow(t / ap, 1.5) : Math.pow((1 - t) / (1 - ap), .7);
    const H = lerp(1.8, 11, smooth(12, 150, r)) * (.72 + .28 * fbm(v * .01 + 3, u * .004, 2));
    h += H * prof * w;
    // rounded star/barchan mounds
    h += w * 2.4 * smooth(.25, .9, fbm(x * .018 + 11, z * .018 - 4, 3) + .35) * smooth(15, 60, r);
    h += w * .5 * fbm(x * .09, z * .09, 3);
  }
  return h;
}
function terrainNormal(x, z, out = new V3()) {
  const e = .03;
  return out.set(terrainH(x - e, z) - terrainH(x + e, z), 2 * e, terrainH(x, z - e) - terrainH(x, z + e)).normalize();
}

/* footprints: a height map around the play area (R = depression, G = raised rim) that the wind slowly erases */
const FOOT = {
  size: 24, res: 1024, rt: null, scene: null, cam: null, stampMat: null, fadeMat: null, pending: [], quad: null,
  init() {
    this.rt = new THREE.WebGLRenderTarget(this.res, this.res, { type: THREE.UnsignedByteType, depthBuffer: false, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
    this.cam = new THREE.OrthographicCamera(-this.size / 2, this.size / 2, this.size / 2, -this.size / 2, -1, 1);

      blending: THREE.CustomBlending, blendEquation: THREE.MaxEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `uniform float uDepth; varying vec2 vUv;
        float blob(vec2 p, vec2 c, vec2 r){ vec2 d = (p - c) / r; return 1.0 - dot(d, d); }
        void main(){

          float t1 = blob(p, vec2(-0.3, 0.52), vec2(0.27, 0.36)), t2 = blob(p, vec2(0.3, 0.52), vec2(0.27, 0.36));

  },
  stamp(x, z, yaw, s = 1, depth = 1) { this.pending.push([x, z, yaw, s, depth]); },

    const fadeAmt = dt * (0.004 + wind * 0.25);

function makeSandMaterial() {

      } catch (err) { scope.postMessage({ id, error: String(err && err.stack || err) }); }
    };
  }
  return { build, pack, field, dist, ST };
}

/* main-thread client: one worker, promise per job, graceful fallback */
const SDF = (() => {
  let worker = null, seq = 0;
  const pending = new Map();
  try {
    const src = '(' + SDFKERNEL.toString() + ')(self);';
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    worker.onmessage = e => {
      const p = pending.get(e.data.id);
      if (!p) return;
      pending.delete(e.data.id);
      if (e.data.error) p.reject(new Error(e.data.error)); else p.resolve(e.data.res);
    };
    worker.onerror = e => { if (e && e.preventDefault) e.preventDefault(); worker = null; for (const [, p] of pending) p.retry(); pending.clear(); };
  } catch (e) { worker = null; }
  let local = null;
  const runLocal = specs => { local = local || SDFKERNEL(null); return specs.map(local.build); };
  return {
    run(specs) {
      if (!worker) return new Promise(r => setTimeout(() => r(runLocal(specs)), 0));
      return new Promise((resolve, reject) => {
        const id = ++seq;
        pending.set(id, { resolve, reject, retry: () => resolve(runLocal(specs)) });
        worker.postMessage({ id, specs });
      });
    },
  };
})();

function rotInv(rx = 0, ry = 0, rz = 0) {            // degrees → inverse rotation (world offset → local), R = Rz·Ry·Rx
  const [a, b, c] = [rx, ry, rz].map(v => v * Math.PI / 180);
  const cx = Math.cos(a), sx = Math.sin(a), cy = Math.cos(b), sy = Math.sin(b), cz = Math.cos(c), sz = Math.sin(c);
  const R = [
    cz * cy, cz * sy * sx - sz * cx, cz * sy * cx + sz * sx,
    sz * cy, sz * sy * sx + cz * cx, sz * sy * cx - cz * sx,
    -sy, cy * sx, cy * cx];
  return [R[0], R[3], R[6], R[1], R[4], R[7], R[2], R[5], R[8]];
}

    for (const t of [1, -1]) C(z([0.66, 0.16, 0.21 + 0.026 * t]), z([0.735, 0.065, 0.21 + 0.04 * t]), 0.03, 0.028, { k: 0.02, bone: bn('pas' + S), tag: 'leg', s: 0.025 });
