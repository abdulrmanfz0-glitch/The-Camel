<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هندسة الناقة</title>
<meta name="description" content="أطلس تفاعلي ثلاثي الأبعاد للناقة وحيدة السنام: التشريح والحركة والحر والبرد ومراحل العمر والصحة والوقاية.">
<meta name="theme-color" content="#0b1524">
<meta property="og:title" content="هندسة الناقة">
<meta property="og:description" content="جسدٌ صُمِّم للصحراء، من الخُفّ إلى السنام.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<canvas id="gl" tabindex="-1" data-i18n-aria="sceneAria" aria-label="مشهد ثلاثي الأبعاد لناقة في الصحراء"></canvas>
<div class="scrim t"></div><div class="scrim b"></div>
<div id="callouts" aria-hidden="true"><svg id="leaders"></svg></div>

<header id="topbar">
  <div class="brand" id="brand" role="button" tabindex="0" data-i18n-aria="homeAria" aria-label="العودة إلى المقدمة">
    <h1 data-i18n="title">هندسة الناقة</h1><span class="sub"><i class="sci">Camelus dromedarius</i></span>
  </div>
  <nav id="chapters" data-i18n-aria="chaptersAria" aria-label="الفصول"></nav>
  <div class="tools">
    <button class="tbtn" id="btnSearch" data-i18n-title="searchTitle" title="ابحث"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span class="t" data-i18n="search">ابحث</span><kbd class="t">/</kbd></button>
    <button class="tbtn" id="btnTour"><svg class="ic" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></svg><span class="t" data-i18n="tour">جولة</span></button>
    <button class="tbtn" id="btnKeys" data-i18n-title="keysTitle" title="الاختصارات"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></button>
    <button class="tbtn lang" id="btnLang"><span class="latn">English</span></button>
  </div>
</header>

<aside id="panel" aria-live="polite">
  <div id="sheetHandle" role="button" tabindex="0" data-i18n-aria="sheetAria" aria-label="حجم اللوحة"><i></i></div>
  <div class="p-scroll" id="pscroll"><div id="pcontent"></div></div>
</aside>
<button class="tbtn" id="panelToggle" data-i18n-title="panelTitle" title="إخفاء اللوحة"><svg class="ic" viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></svg></button>

<div id="dock">
  <div id="readout" class="glass" aria-live="off">
    <div class="ro tb"><span class="k" data-i18n="roBody">حرارة جسمها</span><span class="v num" id="roTb">—</span></div>
    <div class="ro"><span class="k" data-i18n="roAir">الهواء</span><span class="v num" id="roAir">—</span></div>
    <div class="ro opt"><span class="k" data-i18n="roSaved">ماء لم يتبخّر</span><span class="v num" id="roSaved">—</span></div>
    <div class="ro opt"><span class="k" data-i18n="roStatus">الحالة</span><span class="v" id="roStatus" style="font-size:14px">—</span></div>
  </div>
  <div id="dayline" class="glass">
    <button id="playBtn" data-i18n-aria="playAria" aria-label="تشغيل اليوم"><svg class="ic" viewBox="0 0 24 24" id="playIc"><path d="M8 5.5v13l10-6.5z"/></svg></button>
    <div class="day-wrap">
      <canvas id="dayCanvas" aria-hidden="true"></canvas>
      <input type="range" id="day" min="0" max="24" step="0.05" value="16.6" data-i18n-aria="dayAria" aria-label="ساعة اليوم">
      <div id="dayKnob"></div>
    </div>
    <span id="clock" class="num">16:36</span>
    <button id="backDay" type="button" data-i18n="backDay" hidden>رجوع للنهار</button>
  </div>
</div>

<div id="inset" class="glass off" aria-live="polite"></div>
<div id="toast" class="glass" role="status"></div>

<div id="search" hidden>
  <div class="s-box" role="dialog" aria-modal="true" data-i18n-aria="searchTitle" aria-label="ابحث">
    <div class="s-in"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="sq" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="searchPh" placeholder="ابحث عن عضو أو مرض أو فكرة…"><kbd>Esc</kbd></div>
    <div class="s-res" id="sres" role="listbox"></div>
  </div>
</div>

<div id="tour" class="glass" hidden>
  <div class="t-step"><span id="tStep"></span><button id="tExit" class="btn small" data-i18n="tourExit">إنهاء</button></div>
  <div class="t-bar"><i id="tBar"></i></div>
  <h3 id="tTitle"></h3><p id="tText"></p>
  <div class="row"><button class="btn small" id="tPrev" data-i18n="prev">السابق</button><button class="btn small primary" id="tNext" data-i18n="next">التالي</button></div>
</div>

<div id="keys" class="modal" hidden><div class="box" id="keysBox"></div></div>

<div id="loader">
  <div class="ld">
    <h2 data-i18n="title">هندسة الناقة</h2>
    <p data-i18n="loading">نجهّز القافلة…</p>
    <div class="bar"><i id="ldBar"></i></div>
    <div class="caravan" id="ldStep"></div>
    <div class="err" id="ldErr" hidden></div>
  </div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js"}}</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
