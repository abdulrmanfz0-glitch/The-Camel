    E(z([0.71, 0.036, 0.21]), [0.115, 0.038, 0.098], { k: 0.035, bone: bn('toe' + S), tag: 'leg', floor: 0.0, s: 0.03, id: 'padF', cs: 0.01 });
    E(z([0.715, 0.012, 0.21]), [0.112, 0.014, 0.094], { k: 0.012, bone: bn('toe' + S), tag: 'sole', floor: 0.0, s: 0.03, cs: 0.006 });
    for (const t of [1, -1]) E(z([0.815, 0.05, 0.21 + 0.035 * t]), [0.022, 0.014, 0.016], { k: 0.01, bone: bn('toe' + S), tag: 'nail', cs: 0.004, s: 0.02, m: rotInv(0, 0, -25) });
    RG = rr(REG.pad, REG.padR);
    E(z([0.53, 1.07, 0.245]), [0.052, 0.045, 0.036], { k: 0.025, bone: bn('rad' + S), tag: 'pad', cs: 0.005, s: 0.03, id: 'elbowPad' });
    E(z([0.675, 0.625, 0.215]), [0.022, 0.056, 0.046], { k: 0.02, bone: bn('mc' + S), tag: 'pad', cs: 0.005, s: 0.02, id: 'carpalPad' });
    RG = rr(REG.foot, REG.footR);
    E(z([0.87, 0.06, 0.21]), [0.075, 0.05, 0.0055], { op: 1, k: 0.01, bone: bn('toe' + S), id: 'cleft' });

    const Hd = HIND;
    G = 'hind' + S; RG = rr(REG.hind, REG.hindR);
    E(z([-0.555, 1.46, 0.145]), [0.22, 0.22, 0.092], { k: 0.17, bone: bn('fem' + S), s: 0.08 });                                         // hip and gluteals
    C(z(Hd.hip), z(Hd.st), 0.14, 0.08, { k: 0.08, bone: bn('fem' + S), s: 0.05 });                                                  // thigh
    E(z([-0.575, 1.3, 0.16]), [0.1, 0.2, 0.08], { k: 0.14, bone: bn('fem' + S), s: 0.05 });                                        // hamstrings
    E(z([-0.405, 1.2, 0.18]), [0.1, 0.2, 0.07], { k: 0.13, bone: bn('fem' + S), s: 0.05 });                                       // quadriceps
    E(z(Hd.st), [0.058, 0.06, 0.055], { k: 0.06, bone: bn('tib' + S), tag: 'leg', s: 0.03 });                                     // stifle
    C(z(Hd.st), z(Hd.ho), 0.078, 0.046, { k: 0.05, bone: bn('tib' + S), tag: 'leg', s: 0.04 });                                     // gaskin
    E(z([-0.475, 0.83, 0.188]), [0.08, 0.13, 0.058], { k: 0.06, bone: bn('tib' + S), tag: 'leg', s: 0.04 });                         // gastrocnemius
    E(z(Hd.ho), [0.045, 0.05, 0.04], { k: 0.06, bone: bn('mt' + S), tag: 'leg', s: 0.022 });                                      // hock
    E(z([-0.647, 0.61, 0.185]), [0.028, 0.045, 0.028], { k: 0.03, bone: bn('mt' + S), tag: 'leg', s: 0.022 });                    // point of hock
    C(z(Hd.ho, -0.002), z(Hd.fe), 0.04, 0.035, { k: 0.03, bone: bn('mt' + S), tag: 'leg', s: 0.025 });                              // hind cannon
    E(z([-0.6, 0.38, 0.185]), [0.025, 0.15, 0.026], { k: 0.03, bone: bn('mt' + S), tag: 'leg', s: 0.025 });
    E(z([-0.56, 0.185, 0.185]), [0.039, 0.041, 0.044], { k: 0.05, bone: bn('hpas' + S), tag: 'leg', s: 0.022 });
    for (const t of [1, -1]) C(z([-0.55, 0.16, 0.185 + 0.024 * t]), z([-0.495, 0.062, 0.185 + 0.036 * t]), 0.028, 0.026, { k: 0.02, bone: bn('hpas' + S), tag: 'leg', s: 0.025 });
    RG = rr(REG.foot, REG.footR);
    E(z([-0.5, 0.034, 0.185]), [0.1, 0.035, 0.085], { k: 0.035, bone: bn('htoe' + S), tag: 'leg', floor: 0.0, s: 0.03, id: 'padH', cs: 0.01 });
    E(z([-0.5, 0.012, 0.185]), [0.097, 0.013, 0.081], { k: 0.012, bone: bn('htoe' + S), tag: 'sole', floor: 0.0, s: 0.03, cs: 0.006 });
    for (const t of [1, -1]) E(z([-0.41, 0.048, 0.185 + 0.031 * t]), [0.02, 0.013, 0.015], { k: 0.012, bone: bn('htoe' + S), tag: 'nail', cs: 0.004, s: 0.02 });
    RG = rr(REG.pad, REG.padR);
    E(z([-0.285, 0.97, 0.205]), [0.035, 0.05, 0.04], { k: 0.02, bone: bn('tib' + S), tag: 'pad', cs: 0.005, s: 0.03, id: 'stiflePad' });
    RG = rr(REG.foot, REG.footR);
    E(z([-0.37, 0.056, 0.185]), [0.065, 0.045, 0.005], { op: 1, k: 0.01, bone: bn('htoe' + S), id: 'cleft' });
  }

  /* ───── old age: sharper bones, drooping lip, sunken flanks ───── */
  if (ST.old) for (const p of prims) {
    if (p.id === 'coxa' || p.id === 'ischii') { p.r = p.r.map(v => v * 1.35); p.k *= .6; }
    if (p.id === 'lowerLip') { p.c[1] -= .014; p.r[1] *= 1.2; }
  }

  if (ST.plainHump) for (const p of prims) if (p.id && p.id.startsWith('hump')) p.tag = T('coat');

  /* ───── proportions for the life stage ───── */
  const c0 = [0.02, 1.45, 0];
  const aF = FORE.sh, aH = HIND.hip, aN = NECK[0], aT = [-0.8, 1.6, 0], aHump = [-0.04, 1.7, 0];
  const bodyT = p => [c0[0] + ST.sB * (p[0] - c0[0]), c0[1] + ST.sB * (p[1] - c0[1]), c0[2] + ST.sB * (p[2] - c0[2])];
  const hipB = bodyT([aH[0], aH[1], 0]);
  const lift = ST.sL * aH[1] - hipB[1];
  const shB = bodyT([aF[0], aF[1], 0]);
  const sLyF = (shB[1] + lift) / aF[1];
  const up = p => [p[0], p[1] + lift, p[2]];
  const neckB = up(bodyT(aN));
  const pollN = [neckB[0] + ST.sN * (POLL[0] - aN[0]), neckB[1] + ST.sN * (POLL[1] - aN[1]), 0];
  const X = {
    body: { f: p => up(bodyT(p)), s: ST.sB },
    hump: { f: p => { const q = up(bodyT(aHump)); const h = ST.hump; return [q[0] + ST.sB * h[0] * (p[0] - aHump[0]), q[1] + ST.sB * h[1] * (p[1] - aHump[1]), q[2] + ST.sB * h[2] * (p[2] - aHump[2])]; }, s: ST.sB, v: ST.hump },
    neck: { f: p => [neckB[0] + ST.sN * (p[0] - aN[0]), neckB[1] + ST.sN * (p[1] - aN[1]), ST.sN * p[2]], s: ST.sN },
    head: { f: p => [pollN[0] + ST.sH * (p[0] - POLL[0]), pollN[1] + ST.sH * (p[1] - POLL[1]), ST.sH * p[2]], s: ST.sH },
    tail: { f: p => { const q = up(bodyT(aT)); return [q[0] + ST.sB * (p[0] - aT[0]), q[1] + ST.sL * (p[1] - aT[1]), q[2] + ST.sB * p[2]]; }, s: ST.sB },
  };
  for (const [S, sd] of [['L', 1], ['R', -1]]) {
    const A = [aF[0], aF[1], aF[2] * sd], Ab = up(bodyT(A)), Hh = [aH[0], aH[1], aH[2] * sd], Hb = up(bodyT(Hh));
    X['fore' + S] = { f: p => [Ab[0] + ST.sL * (p[0] - A[0]), Ab[1] + sLyF * (p[1] - A[1]), Ab[2] + ST.sL * (p[2] - A[2])], s: ST.sL };
    X['hind' + S] = { f: p => [Hb[0] + ST.sL * (p[0] - Hh[0]), Hb[1] + ST.sL * (p[1] - Hh[1]), Hb[2] + ST.sL * (p[2] - Hh[2])], s: ST.sL };
  }
  for (const p of prims) {
    const x = X[p.g], s = x.s;
    if (p.t === 0) {
      p.c = x.f(p.c);
      p.r = x.v ? p.r.map((r, i) => r * s * x.v[i]) : p.r.map(r => r * s);
    } else { p.a = x.f(p.a); p.b = x.f(p.b); p.ra *= s; p.rb *= s; }
    p.k *= s; if (p.s) p.s *= s; if (p.cs) p.cs *= s;
    if (p.floor !== undefined) p.floor = x.f([0, p.floor, 0])[1];
  }
  for (const b of bones) b.p = X[b.g].f(b.p);
  for (const k in anchors) anchors[k].p = X[anchors[k].g].f(anchors[k].p);

  /* ───── morph variants ───── */
  const clone = () => prims.map(p => JSON.parse(JSON.stringify(p)));
  const variants = [];
  const hs = ST.sB;
  { // hump full: fat reserves topped up
    const V = clone(), ch = [];
    V.forEach((p, i) => { if (p.id && p.id.startsWith('hump')) { p.r = p.r.map((r, j) => r * [1.08, 1.2, 1.12][j]); p.c[1] += 0.035 * hs; ch.push(i); } });
    variants.push({ name: 'humpFull', prims: V, changed: ch });
  }
  { // hump spent: slumps, shrinks and falls to one side
    const V = clone(), ch = [];
    V.forEach((p, i) => {
      if (!p.id || !p.id.startsWith('hump')) return;
      p.r = p.r.map((r, j) => r * [0.9, 0.36, 0.86][j]); p.c[1] -= (p.id === 'humpDome' ? 0.13 : 0.05) * hs;
      if (p.id === 'humpDome') { p.c[2] += 0.07 * hs; p.m = rotInv(24, 0, 0); p.c[1] += 0.01 * hs; }
      ch.push(i);
    });
    variants.push({ name: 'humpEmpty', prims: V, changed: ch, margin: 0.2 });
  }
  { // thin: dehydrated / underfed — tucked flank, sharper hips, visible ribs
    const V = clone(), ch = [];
    V.forEach((p, i) => {
      if (p.reg === REG.belly) { p.r = p.r.map((r, j) => r * [1, 0.9, 0.88][j]); p.c[1] += 0.03 * hs; ch.push(i); }
      if (p.id === 'coxa' || p.id === 'ischii') { p.r = p.r.map(r => r * 1.3); p.k *= 0.5; ch.push(i); }
    });
    for (const sd of [1, -1]) for (let r = 0; r < 6; r++) {
      const x = 0.24 - r * 0.1;
      V.push({ t: 1, a: X.body.f([x + 0.02, 1.72, 0.22 * sd]), b: X.body.f([x - 0.06, 1.2, 0.27 * sd]), ra: 0.018 * hs, rb: 0.016 * hs, op: 1, k: 0.03 * hs, g: 'body', reg: REG.body, tag: T('coat'), bone: bn('chest') });
      ch.push(V.length - 1);
    }
    variants.push({ name: 'thin', prims: V, changed: ch, margin: 0.1 });
  }
  { // nostrils sealed against blowing sand
    const V = clone(), ch = [];
    V.forEach((p, i) => { if (p.id === 'nostril') { p.r = [p.r[0] * 0.9, p.r[1] * 0.2, p.r[2] * 0.3]; ch.push(i); } });
    variants.push({ name: 'nostrilClosed', prims: V, changed: ch, margin: 0.03 });
  }

  /* tags → linear colours with the stage tint */
  const tags = TAG_NAMES.map(n => {
    const t = CAMEL_TAGS[n], c = hexLin(n === 'muzzle' && ST.old ? '#bdb2a4' : t.hex);
    return { color: c.map((v, i) => v * ST.tint[i]), hair: t.hair * (t.hair > 0.3 ? ST.hair : 1), region: 0 };
  });

  // unions first, then subtractions (the field is evaluated in index order); keep morph indices consistent
  const order = prims.map((p, i) => i).sort((a, b) => (prims[a].op === 1) - (prims[b].op === 1) || a - b);
  const remap = new Map(order.map((o, n) => [o, n]));
  const reorder = arr => { const out = order.map(i => arr[i]); for (let i = prims.length; i < arr.length; i++) out.push(arr[i]); return out; };
  for (const v of variants) { v.prims = reorder(v.prims); v.changed = v.changed.map(i => i < prims.length ? remap.get(i) : i); }
  const P2 = reorder(prims);

  const vox = [0.0145, 0.0115, 0.0095][quality] * ST.vox;
  let mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
  for (const p of P2) {
    if (p.op === 1) continue;
    const pts = p.t === 0 ? [[p.c, Math.max(...p.r)]] : [[p.a, p.ra], [p.b, p.rb]];
    for (const [c, r] of pts) for (let i = 0; i < 3; i++) { mn[i] = Math.min(mn[i], c[i] - r - p.k); mx[i] = Math.max(mx[i], c[i] + r + p.k); }
  }
  mn = mn.map(v => v - 3 * vox); mx = mx.map(v => v + 3 * vox); mn[1] = Math.max(mn[1], -2 * vox);
  return { stage: stageName, neck: NECK, neckR: NR, poll: POLL, headPitch: HEAD_PITCH, fore: FORE, hind: HIND, prims: P2, tags, bones, anchors, scale: { body: ST.sB, leg: ST.sL, neck: ST.sN, head: ST.sH }, variants, voxel: vox, bounds: { min: mn, max: mx }, ao: true };
}

/* ════════════════════════════════════════════════════════════════
   the living body: skinned mesh from the SDF build, coat shading,
   fur shells, eyes with lids, lashes and the third eyelid
   ════════════════════════════════════════════════════════════════ */
const GLSL_NOISE3 = `
  float h13(vec3 p){ p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
  float vn3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(h13(i), h13(i + vec3(1,0,0)), f.x), mix(h13(i + vec3(0,1,0)), h13(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(h13(i + vec3(0,0,1)), h13(i + vec3(1,0,1)), f.x), mix(h13(i + vec3(0,1,1)), h13(i + vec3(1,1,1)), f.x), f.y), f.z); }
  vec3 flowDir(vec3 n){ vec3 g = normalize(vec3(-0.55, -0.83, 0.0)); vec3 t = g - dot(g, n) * n; float l = length(t); return l > 1e-3 ? t / l : normalize(cross(n, vec3(0.0, 0.0, 1.0)) + 1e-4); }`;
const GLSL_BUMP = `
  vec3 bumpN(vec3 surf_pos, vec3 surf_norm, vec2 dHdxy, float faceDirection) {
    vec3 vSigmaX = normalize(dFdx(surf_pos.xyz)); vec3 vSigmaY = normalize(dFdy(surf_pos.xyz)); vec3 vN = surf_norm;
    vec3 R1 = cross(vSigmaY, vN); vec3 R2 = cross(vN, vSigmaX);
    float fDet = dot(vSigmaX, R1) * faceDirection;
    vec3 vGrad = sign(fDet) * (dHdxy.x * R1 + dHdxy.y * R2);
    return normalize(abs(fDet) * surf_norm - vGrad); }`;
const HEAT_GLSL = `
  vec3 heatPal(float t){ t = clamp(t, 0.0, 1.0);
    vec3 c0 = vec3(0.02,0.01,0.09), c1 = vec3(0.16,0.02,0.33), c2 = vec3(0.55,0.06,0.33),
         c3 = vec3(0.9,0.27,0.12), c4 = vec3(1.0,0.62,0.12), c5 = vec3(1.0,0.95,0.7);
    float s = t * 5.0;
    if (s < 1.0) return mix(c0, c1, s); if (s < 2.0) return mix(c1, c2, s - 1.0);
    if (s < 3.0) return mix(c2, c3, s - 2.0); if (s < 4.0) return mix(c3, c4, s - 3.0); return mix(c4, c5, s - 4.0); }`;

/* uniforms shared by every camel material (one camel on screen at a time) */
const CU = {
  uTime: { value: 0 }, uSunV: { value: new THREE.Vector3(0, 1, 0) }, uSunCol: { value: new THREE.Color(1, 1, 1) }, uSunI: { value: 1 },
  uHL: { value: Array.from({ length: 20 }, () => new THREE.Vector3()) }, uHLCol: { value: new THREE.Color('#ffb347') },
  uPeel: { value: new THREE.Vector4(0, -99, 0, 0) }, uDust: { value: 0 }, uCoat: { value: 1 }, uGrey: { value: 0 },
  uTb: { value: 37 }, uTair: { value: 30 }, uTmin: { value: 0 }, uTmax: { value: 50 }, uSolar: { value: 0 }, uSunW: { value: new THREE.Vector3(0, 1, 0) },
  uFurLen: { value: 0.012 }, uBumpS: { value: 1 }, uXray: { value: 1 }, uLeg: { value: 1 },
};

function camelMaterials() {
  const common = (sh, extraV = '', extraF = '') => {
    Object.assign(sh.uniforms, CU);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        attribute float hair; attribute float thin; attribute float region; attribute float vao;
        varying float vHair, vThin, vRegion, vAO; varying vec3 vRest, vRestN, vWorld;
        uniform float uShell, uFurLen, uCoat;
        ${GLSL_NOISE3}
        ${extraV}`)
      .replace('#include <beginnormal_vertex>', `#include <beginnormal_vertex>
        vec3 restN = normalize(objectNormal);`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vRest = position; vRestN = restN; vHair = hair; vThin = thin; vRegion = region; vAO = vao;`)
      .replace('#include <worldpos_vertex>', `#include <worldpos_vertex>
        vWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying float vHair, vThin, vRegion, vAO; varying vec3 vRest, vRestN, vWorld;
        uniform float uTime, uSunI, uDust, uCoat, uGrey, uBumpS; uniform vec3 uSunV, uSunCol, uHLCol; uniform vec4 uPeel; uniform vec3 uHL[20];
        ${GLSL_NOISE3}
        ${GLSL_BUMP}
        ${extraF}
        vec3 regionHL(){ int r = int(vRegion + 0.5); vec3 h = vec3(0.0);
          for (int i = 0; i < 20; i++) if (i == r) h = uHL[i];
          return h; }`)
      .replace('void main() {', `void main() {
        if (uPeel.w > 0.0 && distance(vWorld, uPeel.xyz) < uPeel.w) discard;`);
  };

  /* coat & skin: physically based, with procedural hair streaks and derivative bump */
  const skin = new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: .82, metalness: 0, sheen: .6, sheenRoughness: .55, sheenColor: new THREE.Color('#e8c99a'), specularIntensity: .45, side: THREE.DoubleSide, clippingPlanes: ANAT.clip, shadowSide: THREE.FrontSide });
  skin.onBeforeCompile = sh => {
    common(sh);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <color_fragment>', `#include <color_fragment>
        vec3 fl = flowDir(normalize(vRestN)), bt = normalize(cross(normalize(vRestN), fl));
        float hairy = clamp(vHair, 0.0, 1.6);
        float streak = vn3(vec3(dot(vRest, bt) * 900.0, dot(vRest, fl) * 70.0, dot(vRest, normalize(vRestN)) * 300.0));
        float clump = vn3(vRest * 38.0 + vec3(dot(vRest, fl) * 20.0)) ;
        float patchy = vn3(vRest * 6.0) * 0.6 + vn3(vRest * 17.0) * 0.4;
        vec3 base = diffuseColor.rgb;
        base *= mix(1.0, 0.8 + 0.34 * streak, min(hairy, 1.0));
        base *= 0.9 + 0.2 * patchy;
        base = mix(base, base * vec3(1.12, 1.07, 0.98), smoothstep(0.55, 0.9, clump) * min(hairy, 1.0) * 0.6);
        float greyZone = max(1.0 - step(0.5, abs(vRegion - 11.0)), 0.5 * (1.0 - step(0.5, abs(vRegion - 10.0))));
        base = mix(base, vec3(dot(base, vec3(.3,.59,.11))) * vec3(1.05, 1.03, 1.0) * 1.15, uGrey * greyZone * 0.75);
        base = mix(base, vec3(0.62, 0.5, 0.36), uDust * smoothstep(0.1, 0.9, normalize(vRestN).y) * 0.55);
        diffuseColor.rgb = gl_FrontFacing ? base : vec3(0.5, 0.13, 0.1);
        float hH = gl_FrontFacing ? streak * 0.6 + clump * 0.4 : 0.0;`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(0.5, 0.9, clamp(vHair * 1.4, 0.0, 1.0)) - vThin * 0.05;`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        {
          float fade = uBumpS * (1.0 - smoothstep(0.004, 0.02, length(fwidth(vRest))));
          vec2 dh = vec2(dFdx(hH), dFdy(hH)) * 0.0012 * min(hairy + 0.2, 1.2) * fade;
          normal = bumpN(-vViewPosition, normal, dh, faceDirection);
        }`)
      .replace('#include <lights_physical_fragment>', `#include <lights_physical_fragment>
        #ifdef USE_SHEEN
          material.sheenColor *= clamp(vHair, 0.0, 1.0);
        #endif`)
      .replace('#include <aomap_fragment>', `#include <aomap_fragment>
        reflectedLight.indirectDiffuse *= vAO; reflectedLight.indirectSpecular *= vAO;
        reflectedLight.directDiffuse *= mix(1.0, vAO, 0.35);`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        {
          float back = pow(max(dot(normalize(vViewPosition), -uSunV) * 0.5 + 0.5, 0.0), 3.0);
          float sssW = (1.0 - step(0.5, abs(vRegion - 12.0))) + 0.35 * (1.0 - step(0.5, abs(vRegion - 11.0)));
          totalEmissiveRadiance += vec3(0.9, 0.28, 0.12) * uSunCol * uSunI * vThin * back * 0.18 * sssW;
          vec3 hl = regionHL();
          float fr = pow(1.0 - abs(dot(normalize(vViewPosition), normal)), 2.0);
          totalEmissiveRadiance += hl * (0.12 + 0.55 * fr) * (0.85 + 0.15 * sin(uTime * 3.0));
        }`);
  };

  /* fur shells: the same skinned surface pushed out along its rest normal, strands carved by alpha test */
  const shell = n => {

  mats: {},

        g.setIndex(new THREE.BufferAttribute(r.index, 1));

function applyViewOffset() {
  if (!camera) return;

  const tl = [v.t[0] * s, v.t[1] * s, v.t[2] * s];

}

/* ─────────── search palette ─────────── */

  idx: null, sel: 0, res: [],
  build() {

    ANATOMY.topics.forEach(t => add(L('تشريح', 'Anatomy'), t.title, t.sum, () => go('anatomy', t.id), t.body.ar + t.body.en));
    MOVEMENT.topics.forEach(t => add(L('حركة', 'Movement'), t.title, t.sum, () => go('movement', t.id), t.body.ar + t.body.en));
    CLIMATE.topics.forEach(t => add(L('مناخ', 'Climate'), t.title, t.sum, () => go('climate', t.id), t.body.ar + t.body.en));
    HEALTH.list.forEach(d => add(L('مرض', 'Disease'), d.name, d.signs, () => go('health', d.id), [d.cause, d.spread].map(x => x.ar + x.en).join(' ')));
    Object.entries(ANATOMY.organs).forEach(([k, n]) => add(L('عضو', 'Organ'), n, L('في طبقة الأعضاء', 'in the organs layer'), () => { go('anatomy', organTopic(k)); }));

    LIFE.names.forEach(n => add(L('اسم', 'Name'), L(n[0], n[0]), n[1], () => go('life'), n[2].ar + n[2].en));
    PREVENT.care.forEach(([i, a, b]) => add(L('وقاية', 'Prevention'), a, b, () => go('prevention')));
    add(L('فعل', 'Action'), L('اشربي', 'Drink'), L('نحو مئة لتر', 'about 100 L'), () => { go('movement'); ACT.drink(); });
    add(L('فعل', 'Action'), L('عاصفة رملية', 'Sandstorm'), L('الجفن الثالث والمنخران', 'third eyelid, nostrils'), () => { go('movement'); ACT.storm(); });

    if (k === 'ArrowRight' || k === 'ArrowLeft') { if (tag === 'input') return; const d = (k === 'ArrowRight') !== (root.dir === 'rtl') ? .25 : -.25; setPlaying(false); setHour(STATE.hour + d); return; }

/* ════════════════════════════════════════════════════════════════
   main: actions, boot, the frame loop
   ════════════════════════════════════════════════════════════════ */
const ACT = {
  couch(force) {
    const want = force === undefined ? !STATE.couched : !!force;
    if (want === STATE.couched) return;
    if (want) { if (STATE.gait !== 'stand') setGait('stand'); if (STATE.drink) return; }
    STATE.couched = want;
    toast(want ? UI.toast.couch : UI.toast.rise);
    const b = $('#actCouch'); if (b) b.innerHTML = ic('couch') + tt(want ? MOVEMENT.rise : MOVEMENT.couch);
  },
  drink() {
    if (STATE.drink || !WORLD.camel) return;
    setGait('stand');
    if (STATE.couched) ACT.couch(false);
    const s = WORLD.camel.spec.scale.body;
    STATE.drink = { t: 0, dur: 12, from: STATE.loss, lead: STATE.couched ? 3 : .4 };
    const p = localToWorldPt([1.6 * s + .12, 0, 0]);
    WORLD.trough.g.position.set(p.x, terrainH(p.x, p.z) - .02, p.z);
    WORLD.trough.g.rotation.y = camelFrame().yaw;
    WORLD.trough.g.scale.setScalar(.01); WORLD.trough.g.visible = true; WORLD.trough.setLevel(1);
    toast(UI.toast.drink, 4000);
    INSET.show('rbc');
  },
  storm() { if (STATE.stormT > 0) { ACT.stopStorm(); return; } STATE.stormT = 16; toast(UI.toast.storm, 4000); },
  stopStorm(now) { STATE.stormT = 0; if (now) STATE.storm = 0; },
};
STATE.stormT = 0;

let lastT = 0, fpsAcc = 0, fpsN = 0, lowFor = 0, qualityStep = 0, readoutT = 0, clockT = 0;
const QUALITY_STEPS = [
  () => { renderer.setPixelRatio(1); onResize(); },
  () => { Q.ssao = false; WORLD.camel && WORLD.camel.shells.forEach((m, i) => { if (i % 2) m.visible = false; }); Q.shells = Math.ceil(Q.shells / 2); },
  () => { Q.dof = false; Q.shells = 0; for (const k in WORLD.stages) WORLD.stages[k].camel.shells.forEach(m => { m.visible = false; }); },
];

function onResize() {
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H, false);
  const pr = renderer.getPixelRatio();
  post.setSize(Math.round(W * pr), Math.round(H * pr));
  camera.aspect = W / H; camera.updateProjectionMatrix();
  if (typeof applyViewOffset === 'function' && WORLD.camel) applyViewOffset();
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(window.__maxDt || .05, Math.max(.001, (now - (lastT || now)) / 1000)); lastT = now;
  const t = now / 1000;
  // adaptive quality: step down if we stay slow
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 2) { const fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; lowFor = fps < 26 ? lowFor + 1 : 0; if (lowFor >= 2 && qualityStep < QUALITY_STEPS.length && document.visibilityState === 'visible') { QUALITY_STEPS[qualityStep++](); lowFor = 0; if (qualityStep === 1) toast(UI.toast.quality); } }
  // clock
  tweenHour(dt);
  if (STATE.playing) { STATE.hour = wrap24(STATE.hour + dt * (ENV.reduce ? .25 : .55)); clockT += dt; if (clockT > .05) { clockT = 0; drawDay(); } }
  // storm and drink timelines
  if (STATE.stormT > 0) STATE.stormT -= dt;
  STATE.storm = damp(STATE.storm, STATE.stormT > 0 ? 1 : 0, STATE.stormT > 0 ? .9 : .6, dt);
  if (STATE.storm < .002 && STATE.stormT <= 0) STATE.storm = 0;
  const D = STATE.drink;
  if (D) {
    D.t += dt;
    const k = clamp((D.t - D.lead - 1.6) / (D.dur - D.lead - 3.4), 0, 1);
    WORLD.trough.g.scale.setScalar(damp(WORLD.trough.g.scale.x, D.t < D.dur - .6 ? 1 : .01, 5, dt));
    WORLD.trough.setLevel(1 - k * .85);
    STATE.loss = lerp(D.from, 0, easeOut(k));
    const lr = $('#lossR'); if (lr) { lr.value = STATE.loss; pctRange(lr); $('#lossOut').textContent = pct(STATE.loss); }
    if (D.t > D.dur) { STATE.drink = null; WORLD.trough.g.visible = false; drawDay(true); }
  }
  // the body
  const cam = WORLD.camel, crig = WORLD.crig;
  if (cam && crig) {
    const drinking = D && D.t > D.lead && D.t < D.dur - 1.4;
    crig.update(dt, { couch: STATE.couched, drink: drinking, storm: STATE.storm, nostril: 0 });
    const h = STATE.hump / 100;
    cam.setMorph('humpFull', smooth(.62, 1, h));
    cam.setMorph('humpEmpty', smooth(.5, 0, h) + (STATE.stage === 'old' ? .25 : 0));
    cam.setMorph('thin', clamp(smooth(8, 26, STATE.loss) * .85 + (STATE.stage === 'old' ? .35 : 0), 0, 1));
    // anatomy
    ANAT.update(dt);
    if (ANAT.built && STATE.stage === 'adult') {
      const peelOn = U.peel && U.chapter === 'anatomy';
      ANAT.organs.forEach(o => { o.holder.visible = STATE.layer === 'organs' || peelOn; });
      ANAT.bones.forEach(b => { b.mesh.visible = STATE.layer === 'skeleton' || STATE.layer === 'organs' || peelOn; });
      if (U.section && U.chapter === 'anatomy') ANAT.setSection(U.section === 'sagittal' ? 'sagittal' : 'trans', U.section === 'sagittal' ? 0 : U.sectionX, cam);
      else ANAT.setSection(null);
    }
    // peel window: a sphere around the point under the pointer, on the body's mid-plane
    if (U.peel && U.chapter === 'anatomy' && U.pointer) {
      const ndc = new THREE.Vector2(U.pointer.x / innerWidth * 2 - 1, -(U.pointer.y / innerHeight) * 2 + 1);
      const ray = new THREE.Raycaster(); ray.setFromCamera(ndc, camera);
      const g = cam.group, n = camera.getWorldDirection(new V3()).negate(), c = g.position.clone().setY(1.25 * cam.spec.scale.body);
      const pl = new THREE.Plane().setFromNormalAndCoplanarPoint(n, c), hit = new V3();
      if (ray.ray.intersectPlane(pl, hit) && hit.distanceTo(c) < 1.6) CU.uPeel.value.set(hit.x, hit.y, hit.z, .42); else CU.uPeel.value.w = 0;
    } else CU.uPeel.value.w = 0;
  }
  // camera: follow the walking camel unless the user has taken over
  if (cam && U.follow && (U.chapter === 'movement' || TOURX.on) && performance.now() - U.userT > 3500 && !rig.fly) {
    const tl = U.followT || [0, 1, 0], p = localToWorldPt(tl);
    rig.target.lerp(p, 1 - Math.exp(-2.5 * dt));
    let d = (camelFrame().yaw + (U.followAz || 0)) - rig.theta; d = ((d + Math.PI) % TAU + TAU) % TAU - Math.PI;
    rig.theta += d * (1 - Math.exp(-1.2 * dt));
  }
  rig.update(dt);
  camera.updateMatrixWorld();
  sky.u.uCamInvView.value.copy(camera.matrixWorld); sky.u.uProjInv.value.copy(camera.projectionMatrixInverse); sky.u.uAspect.value = camera.aspect;
  WORLD.updateLight(dt, t);
  FOOT.update(dt, STATE.storm);
  WORLD.dust.update(dt, STATE.storm, rig.target, t);
  WORLD.dust.mat.uniforms.uPR.value = renderer.getPixelRatio();
  WORLD.dust.mat.uniforms.uLight.value = .35 + .65 * smooth(-.1, .3, WORLD.sunDir.y);
  HL.apply(t);
  // post: depth of field in close-ups, heat shimmer on hot afternoons
  const pp = post.params;
  pp.aoStrength.value = .75; pp.bloom.value = .05; pp.vignette.value = .3; pp.grain.value = .014;
  pp.focus.value = rig.r; pp.aperture.value = Q.dof && rig.r < 2.6 && !ENV.reduce ? smooth(2.6, 1, rig.r) * 1.3 : 0;
  const air = MODEL.air(STATE.hour, STATE.season);
  pp.shimmer.value = STATE.layer === 'thermal' || ENV.reduce ? 0 : smooth(36, 43, air) * smooth(.1, .4, WORLD.sunDir.y) * (1 - STATE.storm);
  pp.hazeAmt.value = 0; pp.contrast.value = 1.03;
  post.render(scene, camera, t);
  // interface
  readoutT -= dt;
  if (readoutT <= 0) { readoutT = .12; updateReadout(); }
  updateCallouts(dt);
  if (U.chapter === 'movement') updateGaitCursor();
  INSET.update(dt);
  TOURX.update(dt);
}

async function boot() {
  const bar = $('#ldBar'), step = $('#ldStep');
  const prog = (p, i) => { bar.style.width = (p * 100).toFixed(0) + '%'; if (i != null) step.textContent = tt(UI.ldSteps[i]); };
  const deep = initUI();
  prog(.12, 0);
  const canvas = $('#gl');
  try { renderer = makeRenderer(canvas); }
  catch (e) { $('#ldErr').hidden = false; $('#ldErr').textContent = tt(UI.errGL); bar.parentElement.hidden = true; return; }
  post = new Post(renderer);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, Q.dpr));
  await new Promise(r => setTimeout(r, 20));
  prog(.22, 1);
  await new Promise(r => setTimeout(r, 20));
  WORLD.init();
  onResize();
  rig = new Rig(camera, canvas);
  prog(.4, 2);
  const tick = setInterval(() => { const w = parseFloat(bar.style.width) || 40; if (w < 88) bar.style.width = (w + 2) + '%'; }, 250);
  try { await WORLD.loadStage('adult'); } catch (e) { clearInterval(tick); $('#ldErr').hidden = false; $('#ldErr').textContent = String(e && e.message || e); return; }
  clearInterval(tick);
  prog(.92, 3);
  WORLD.show('adult');
  // one frame of warm-up so every shader compiles before the reveal
  applyViewOffset();
  U.chapter = deep.chapter;
  go(deep.chapter, deep.topic, { force: true, noHash: true });
  const v = rig.fly ? rig.fly.to : null;
  if (v && !ENV.reduce) { rig.fly = null; rig.target.copy(v.target).add(new V3(0, .4, 0)); rig.r = v.r * 1.9; rig.theta = v.theta - .7; rig.phi = v.phi - .12; rig.flyTo(v, 3.2); }
  prog(1, 4);
  drawDay(true);
  requestAnimationFrame(frame);
  setTimeout(() => $('#loader').classList.add('done'), 350);
  addEventListener('resize', onResize);
  document.addEventListener('visibilitychange', () => { lastT = 0; });
  // warm the other life stages in the background, one at a time
  setTimeout(async () => { for (const s of ['newborn', 'juvenile', 'old']) { try { await WORLD.loadStage(s); } catch (e) { /* stays unavailable */ } } }, 5000);
}
boot();

}
</script>
