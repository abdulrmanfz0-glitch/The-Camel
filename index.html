/* ─────────── sky and light: Preetham daylight sky, analytic twilight and night, real sun over Riyadh ───────────
   The sky's shape and hue gradient come from the Preetham model (as in the three.js Sky example). Its absolute
   energy is rebalanced so that sun and sky irradiance follow a dusty clear atmosphere: Rayleigh + desert aerosol
   optical depths, Kasten–Young air mass. The same numbers drive the sun light, the image-based light, the aerial
   perspective and the exposure, so the frame is never tinted by hand.                                          */
const ATM = {
  lat: 24.71 * DEG, lon: 46.72,                       // Riyadh
  tauR: [0.034, 0.090, 0.205], tauA: [0.14, 0.16, 0.18], // optical depth at 680 / 550 / 450 nm (Rayleigh, dust haze)
  turbidity: 4.2, rayleigh: 1.35, mie: 0.0065, g: 0.8,
  sandAlb: [0.52, 0.36, 0.22],                         // linear albedo of the local sand (for bounce light)
  sunDir: new V3(0, 1, 0), moonDir: new V3(-.35, .62, .7).normalize(),
  Esun: [1, 1, 1], Esky: [.2, .2, .2], Emoon: 0, el: 0, key: 1, twi: 0, night: 0,
  betaR: new V3(), betaM: new V3(), sunE: 0, skyScale: new V3(1, 1, 1), sunDisk: new V3(),
  _cache: new Map(),
  /* solar position: declination for the chosen day, clock time in Arabia Standard Time (UTC+3) */
  sun(h, season, out) {
    const day = season === 'winter' ? 355 : 172;
    const g = TAU / 365 * (day - 1 + (h - 12) / 24);
    const decl = .006918 - .399912 * Math.cos(g) + .070257 * Math.sin(g) - .006758 * Math.cos(2 * g) + .000907 * Math.sin(2 * g) - .002697 * Math.cos(3 * g) + .00148 * Math.sin(3 * g);
    const eot = 229.18 * (.000075 + .001868 * Math.cos(g) - .032077 * Math.sin(g) - .014615 * Math.cos(2 * g) - .040849 * Math.sin(2 * g));
    const solar = h + (4 * (this.lon - 45) + eot) / 60;
    const H = (solar - 12) * 15 * DEG, L = this.lat;
    const e = -Math.cos(decl) * Math.sin(H);
    const n = Math.sin(decl) * Math.cos(L) - Math.cos(decl) * Math.cos(H) * Math.sin(L);
    const u = Math.sin(decl) * Math.sin(L) + Math.cos(decl) * Math.cos(H) * Math.cos(L);
    return out.set(e, u, -n).normalize();              // world: +X east, −Z north, +Y up
  },
  airmass(el) { const d = Math.max(el / DEG, -1.5); return 1 / (Math.max(Math.sin(Math.max(el, -1.5 * DEG)), 0) + .50572 * Math.pow(d + 6.07995, -1.6364)); },
  /* Preetham radiance (three.js Sky.js, ported) for calibration */
  preetham(d, s, out) {
    const za = Math.acos(Math.max(0, d[1])), inv = 1 / (Math.cos(za) + .15 * Math.pow(93.885 - za / DEG, -1.253));
    const ct = d[0] * s[0] + d[1] * s[1] + d[2] * s[2], rP = .0596831 * (1 + sq(ct * .5 + .5));
    const g = this.g, g2 = g * g, mP = .0795775 * (1 - g2) / Math.pow(1 - 2 * g * ct + g2, 1.5);
    const bR = [this.betaR.x, this.betaR.y, this.betaR.z], bM = [this.betaM.x, this.betaM.y, this.betaM.z];
    const k = clamp(Math.pow(1 - s[1], 5), 0, 1);
    for (let i = 0; i < 3; i++) {
      const Fex = Math.exp(-(bR[i] * 8.4e3 * inv + bM[i] * 1.25e3 * inv));
      const r = (bR[i] * rP + bM[i] * mP) / (bR[i] + bM[i]);
      let Lin = Math.pow(this.sunE * r * (1 - Fex), 1.5);
      Lin *= lerp(1, Math.pow(this.sunE * r * Fex, .5), k);
      out[i] = (Lin + .1 * Fex) * .04;
    }
    return out;
  },
  preethamE(s) {                                       // horizontal irradiance of the Preetham sky
    const key = Math.round(s[1] * 400) + ':' + Math.round(this.sunE);
    if (this._cache.has(key)) return this._cache.get(key);
    const E = [0, 0, 0], L = [0, 0, 0], NT = 14, NP = 28, sa = Math.atan2(s[2], s[0]);
    for (let i = 0; i < NT; i++) for (let j = 0; j < NP; j++) {
      const th = (i + .5) / NT * Math.PI / 2, ph = sa + (j + .5) / NP * TAU;
      this.preetham([Math.sin(th) * Math.cos(ph), Math.cos(th), Math.sin(th) * Math.sin(ph)], s, L);
      const w = Math.cos(th) * Math.sin(th) * (Math.PI / 2 / NT) * (TAU / NP);
      E[0] += L[0] * w; E[1] += L[1] * w; E[2] += L[2] * w;
    }
    if (this._cache.size > 4000) this._cache.clear();
    this._cache.set(key, E);
    return E;
  },
  update(h, season, storm) {
    const s = this.sun(h, season, this.sunDir), el = Math.asin(clamp(s.y, -1, 1));
    this.el = el;
    // Preetham parameters (constant atmosphere; the sun's zenith angle drives it)
    const zc = clamp(s.y, -1, 1);
    this.sunE = 1000 * Math.max(0, 1 - Math.exp(-((1.6110731556870734 - Math.acos(zc)) / 1.5)));
    const tr = [5.804542996261093E-6, 1.3562911419845635E-5, 3.0265902468824876E-5], mc = [1.8399918514433978E14, 2.7798023919660528E14, 4.0790479543861094E14];
    const c = .2 * this.turbidity * 10E-18;
    this.betaR.set(tr[0] * this.rayleigh, tr[1] * this.rayleigh, tr[2] * this.rayleigh);
    this.betaM.set(.434 * c * mc[0] * this.mie, .434 * c * mc[1] * this.mie, .434 * c * mc[2] * this.mie);
    // direct sun: transmittance along the slant path, then the disc sinking below the horizon
    const m = this.airmass(el), vis = smooth(-.9 * DEG, .6 * DEG, el), dust = 1 + 2.5 * storm;
    for (let i = 0; i < 3; i++) this.Esun[i] = Math.exp(-m * (this.tauR[i] + this.tauA[i] * dust)) * vis;
    // diffuse sky: what the slant path scattered out, part of it reaching the ground; twilight tail below
    const se = Math.max(Math.sin(el), 0), F = .42 * (.55 + .45 * se);
    const twi = .0062 * Math.exp(clamp(el / DEG, -18, 0) * .72) * (1 - smooth(0, 5 * DEG, el) * .6);   // civil twilight fall-off
    const twiCol = [.55, .72, 1.0];
    for (let i = 0; i < 3; i++) {
      const Td = Math.exp(-m * (this.tauR[i] + this.tauA[i] * dust));
      const day = se * (1 - Td) * F;
      this.Esky[i] = day + twi * twiCol[i] * (1 - smooth(1 * DEG, 8 * DEG, el));
    }
    // night: moonlight (a stylised quarter-to-full moon) and airglow
    this.night = 1 - smooth(-14 * DEG, -5 * DEG, el);
    this.twi = (1 - smooth(2 * DEG, 10 * DEG, el)) * (1 - this.night * .92);
    const moonUp = Math.max(this.moonDir.y, 0);
    this.Emoon = .0016 * moonUp * this.night;
    const nightSky = [.00059, .00085, .0016];
    for (let i = 0; i < 3; i++) this.Esky[i] += nightSky[i] * this.night;
    // scale the Preetham sky so its irradiance matches the model (fade it out as the sun goes down)
    const EP = this.sunE > 1 ? this.preethamE([s.x, s.y, s.z]) : [1, 1, 1];
    const dayW = smooth(-1.5 * DEG, 3 * DEG, el);
    // energy from the model, hue mostly from Preetham (a clear sky is bluer than its irradiance suggests)
    const Ed = [0, 1, 2].map(i => Math.max(this.Esky[i] - twi * twiCol[i] * (1 - smooth(1 * DEG, 8 * DEG, el)) - nightSky[i] * this.night, 0));
    const lumD = Ed[0] * .2126 + Ed[1] * .7152 + Ed[2] * .0722, lumP = Math.max(EP[0] * .2126 + EP[1] * .7152 + EP[2] * .0722, 1e-9), rL = lumD / lumP;
    for (let i = 0; i < 3; i++) this.skyScale.setComponent(i, dayW * rL * Math.pow(Math.max(Ed[i] / Math.max(EP[i], 1e-9), 1e-9) / Math.max(rL, 1e-9), .3));
    // the sun disc radiance (irradiance over the disc's solid angle, capped for half floats)
    for (let i = 0; i < 3; i++) this.sunDisk.setComponent(i, Math.min(this.Esun[i] / 6.8e-5, 3.0e4));
    // exposure key: horizontal illuminance, compressed a little so dusk reads darker than noon
    const lum = a => a[0] * .2126 + a[1] * .7152 + a[2] * .0722;
    const Eh = lum(this.Esun) * se + lum(this.Esky) + this.Emoon * .8 * moonUp;
    this.key = Eh;
    return this;
  },
};

const SKY_GLSL = `
  uniform vec3 uSunDir, uMoonDir, uBetaR, uBetaM, uSkyScale, uSunDisk, uGroundE, uTwiCol;
  uniform float uSunE, uMieG, uTwi, uNight, uStorm, uThermal, uTwiK;
  vec3 preetham(vec3 d){
    float za = acos(max(0.0, d.y));
    float inv = 1.0 / (cos(za) + 0.15 * pow(max(93.885 - za * 57.2957795, 1e-3), -1.253));
    vec3 Fex = exp(-(uBetaR * 8.4e3 * inv + uBetaM * 1.25e3 * inv));
    float ct = dot(d, uSunDir);
    float rP = 0.0596831 * (1.0 + pow(ct * 0.5 + 0.5, 2.0));
    float g2 = uMieG * uMieG;
    float mP = 0.0795775 * (1.0 - g2) / pow(1.0 - 2.0 * uMieG * ct + g2, 1.5);
    vec3 r = (uBetaR * rP + uBetaM * mP) / (uBetaR + uBetaM);
    vec3 Lin = pow(uSunE * r * (1.0 - Fex), vec3(1.5));
    Lin *= mix(vec3(1.0), pow(uSunE * r * Fex, vec3(0.5)), clamp(pow(1.0 - uSunDir.y, 5.0), 0.0, 1.0));
    return (Lin + 0.1 * Fex) * 0.04;
  }
  /* twilight: warm band under the sun, the pink belt of Venus over the blue earth shadow opposite */
  vec3 twilightSky(vec3 d){
    float h = max(d.y, 0.0);
    vec2 a = normalize(d.xz + vec2(1e-5)), sa = normalize(uSunDir.xz + vec2(1e-5));
    float tw = dot(a, sa) * 0.5 + 0.5;
    float sunDown = clamp(-uSunDir.y * 12.0, 0.0, 1.0);
    vec3 warm = mix(vec3(1.0, 0.62, 0.34), vec3(1.0, 0.36, 0.12), sunDown);
    vec3 belt = vec3(0.66, 0.42, 0.52), shadow = vec3(0.2, 0.26, 0.46), zen = vec3(0.1, 0.18, 0.46);
    vec3 anti = mix(shadow, belt, smoothstep(0.02, 0.1, h) * (1.0 - smoothstep(0.12, 0.3, h)));
    vec3 band = mix(anti, warm, pow(tw, 2.5));
    float bh = exp(-h / mix(0.1, 0.22, tw * tw));
    return mix(zen, band, bh) * (1.0 + 2.2 * pow(max(dot(d, uSunDir), 0.0), 6.0) * (1.0 - sunDown * 0.6));
  }
  vec3 skyRad(vec3 d){
    vec3 dd = normalize(vec3(d.x, max(d.y, 0.0), d.z));
    vec3 c = preetham(dd) * uSkyScale;
    c += twilightSky(dd) * uTwiK * uTwiCol;
    c += vec3(0.00022, 0.00032, 0.0006) * uNight * (0.6 + 0.4 * dd.y);
    float md = max(dot(dd, uMoonDir), 0.0);
    c += vec3(0.55, 0.62, 0.75) * (pow(md, 12.0) * 0.004 + pow(md, 900.0) * 0.4 + smoothstep(0.99994, 0.99997, md) * 3.5) * uNight * step(0.0, uMoonDir.y);
    return c;
  }
  vec3 sunDiscRad(vec3 d){ float ct = dot(d, uSunDir); return uSunDisk * smoothstep(0.999955, 0.99997, ct) * step(-0.01, d.y); }`;

function makeSky() {
  const u = {
    uSunDir: { value: ATM.sunDir }, uMoonDir: { value: ATM.moonDir }, uBetaR: { value: ATM.betaR }, uBetaM: { value: ATM.betaM },
    uSkyScale: { value: ATM.skyScale }, uSunDisk: { value: ATM.sunDisk }, uGroundE: { value: new THREE.Color() }, uTwiCol: { value: new V3(1, 1, 1) },
    uSunE: { value: 0 }, uMieG: { value: ATM.g }, uTwi: { value: 0 }, uNight: { value: 0 }, uStorm: { value: 0 }, uThermal: { value: 0 }, uTwiK: { value: 0 },
    uDustCol: { value: new THREE.Color() }, uAspect: { value: 1 }, uTime: { value: 0 }, uStars: { value: 0 },
    uCamInvView: { value: new THREE.Matrix4() }, uProjInv: { value: new THREE.Matrix4() },
  };

  const back = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
    uniforms: u, depthTest: false, depthWrite: false,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 1.0, 1.0); }`,
    fragmentShader: `varying vec2 vUv; ${SKY_GLSL} uniform vec3 uDustCol; uniform float uAspect, uTime, uStars; uniform mat4 uCamInvView, uProjInv;
      ${GLSL_COMMON}

      float starField(vec3 d){

        vec2 q = uv * 190.0, id = floor(q), f = fract(q) - 0.5;

        c = mix(c, uDustCol * (0.75 + 0.35 * el), uStorm * 0.92);

  const envScene = new THREE.Scene();

    uniforms: u, side: THREE.BackSide, depthWrite: false,
    vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `varying vec3 vD; ${SKY_GLSL} uniform vec3 uDustCol;
      void main(){ vec3 d = normalize(vD); vec3 c = skyRad(d);
        c = mix(c, uGroundE, smoothstep(0.0, -0.08, d.y));

  }));

    u, back, envScene,
    updateEnv(key, force) {

      if (envRT) envRT.dispose();
      envRT = rt;
      scene.environment = rt.texture;
    },
  };
}

/* ─────────── camera rig with auto-fit into the free part of the screen ─────────── */

/* ════════════════════════════════════════════════════════════════

const PLAY_R = 7.5;          // the flat sand where she walks

  const r = Math.hypot(x, z);

  const w = smooth(PLAY_R + .5, 26, r);

    const a = 18 * DEG, u = x * Math.cos(a) + z * Math.sin(a), v = -x * Math.sin(a) + z * Math.cos(a);
    const crest = u + 7 * Math.sin(v * .041) + 2.6 * Math.sin(v * .13 + 1.7);

/* footprints: a height map around the play area (R = depression, G = raised rim) that the wind slowly erases */

        // a vertex that never reached the new surface along its direction stays where it was (no spikes)
        if (abs(field(PV, L, x, y, z)) > 2 * vox) continue;
        delta[v * 3] = x - x0; delta[v * 3 + 1] = y - y0; delta[v * 3 + 2] = z - z0;
      }
      out.morphs[vr.name] = delta;
    }
    out.timing = [T1 - T0, T2 - T1, T3 - T2, T4 - T3, Date.now() - T4];
    return out;
  }
  function transfers(o) {
    const t = [o.pos.buffer, o.nor.buffer, o.index.buffer, o.col.buffer, o.hair.buffer, o.thin.buffer, o.region.buffer];
    if (o.sIdx) t.push(o.sIdx.buffer, o.sW.buffer);
    for (const k in o.morphs) t.push(o.morphs[k].buffer);
    return t;
  }
  if (scope) {
    scope.onmessage = e => {
      const { id, specs } = e.data;
      try {
        const res = specs.map(build);
        const tr = [];
        res.forEach(r => tr.push(...transfers(r)));
        scope.postMessage({ id, res }, tr);
      } catch (err) { scope.postMessage({ id, error: String(err && err.stack || err) }); }
    };
  }
  return { build, pack, field, dist, ST };
}

/* main-thread client: one worker, promise per job, graceful fallback */
const SDF = (() => {
  let worker = null, seq = 0;
  const pending = new Map();
  try {
    const src = '(' + SDFKERNEL.toString() + ')(self);';
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    worker.onmessage = e => {
      const p = pending.get(e.data.id);
      if (!p) return;
      pending.delete(e.data.id);
      if (e.data.error) p.reject(new Error(e.data.error)); else p.resolve(e.data.res);
    };
    worker.onerror = e => { if (e && e.preventDefault) e.preventDefault(); worker = null; for (const [, p] of pending) p.retry(); pending.clear(); };
  } catch (e) { worker = null; }
  let local = null;
  const runLocal = specs => { local = local || SDFKERNEL(null); return specs.map(local.build); };
  return {
    run(specs) {
      if (!worker) return new Promise(r => setTimeout(() => r(runLocal(specs)), 0));
      return new Promise((resolve, reject) => {
        const id = ++seq;
        pending.set(id, { resolve, reject, retry: () => resolve(runLocal(specs)) });
        worker.postMessage({ id, specs });
      });
    },
  };
})();

function rotInv(rx = 0, ry = 0, rz = 0) {            // degrees → inverse rotation (world offset → local), R = Rz·Ry·Rx
  const [a, b, c] = [rx, ry, rz].map(v => v * Math.PI / 180);

    cz * cy, cz * sy * sx - sz * cx, cz * sy * cx + sz * sx,
    sz * cy, sz * sy * sx + cz * cx, sz * sy * cx - cz * sx,
    -sy, cy * sx, cy * cx];
  return [R[0], R[3], R[6], R[1], R[4], R[7], R[2], R[5], R[8]];

    for (const t of [1, -1]) C(z([0.66, 0.16, 0.21 + 0.028 * t]), z([0.735, 0.062, 0.21 + 0.043 * t]), 0.026, 0.024, { k: 0.016, bone: bn('pas' + S), tag: 'leg', s: 0.025 });
    RG = rr(REG.foot, REG.footR);
    E(z([0.712, 0.036, 0.21]), [0.112, 0.04, 0.094], { k: 0.028, bone: bn('toe' + S), tag: 'leg', floor: 0.0, s: 0.03, id: 'padF', cs: 0.01 });      // the cushion
    for (const t of [1, -1]) E(z([0.755, 0.062, 0.21 + 0.036 * t]), [0.06, 0.03, 0.034], { k: 0.022, bone: bn('toe' + S), tag: 'leg', s: 0.03 });  // the two toes on top

    for (const t of [1, -1]) E(z([0.82, 0.045, 0.21 + 0.036 * t]), [0.018, 0.012, 0.014], { k: 0.008, bone: bn('toe' + S), tag: 'nail', cs: 0.004, s: 0.02, m: rotInv(0, 0, -25) });
    RG = rr(REG.pad, REG.padR);
    E(z([0.53, 1.07, 0.24]), [0.05, 0.043, 0.032], { k: 0.022, bone: bn('rad' + S), tag: 'pad', cs: 0.005, s: 0.03, id: 'elbowPad' });
    E(z([0.662, 0.625, 0.215]), [0.014, 0.054, 0.044], { k: 0.016, bone: bn('mc' + S), tag: 'pad', cs: 0.005, s: 0.02, id: 'carpalPad' });
    RG = rr(REG.foot, REG.footR);
    E(z([0.875, 0.058, 0.21]), [0.075, 0.048, 0.005], { op: 1, k: 0.01, bone: bn('toe' + S), id: 'cleft' });

    const Hd = HIND;
    G = 'hind' + S; RG = rr(REG.hind, REG.hindR);
    E(z([-0.555, 1.46, 0.14]), [0.2, 0.2, 0.08], { k: 0.16, bone: bn('fem' + S), s: 0.08 });                                          // hip and gluteals
    C(z(Hd.hip), z(Hd.st), 0.115, 0.064, { k: 0.08, bone: bn('fem' + S), s: 0.05 });                                                  // thigh
    E(z([-0.575, 1.3, 0.155]), [0.085, 0.19, 0.064], { k: 0.13, bone: bn('fem' + S), s: 0.05 });                                     // hamstrings
    E(z([-0.405, 1.2, 0.175]), [0.085, 0.17, 0.058], { k: 0.12, bone: bn('fem' + S), s: 0.05 });                                     // quadriceps
    E(z(Hd.st), [0.05, 0.052, 0.048], { k: 0.05, bone: bn('tib' + S), tag: 'leg', s: 0.03 });                                      // stifle
    C(z(Hd.st), z(Hd.ho), 0.06, 0.034, { k: 0.045, bone: bn('tib' + S), tag: 'leg', s: 0.04 });                                     // gaskin
    E(z([-0.47, 0.84, 0.186]), [0.06, 0.12, 0.045], { k: 0.05, bone: bn('tib' + S), tag: 'leg', s: 0.04 });                          // gastrocnemius
    E(z(Hd.ho), [0.042, 0.047, 0.037], { k: 0.045, bone: bn('mt' + S), tag: 'leg', s: 0.022, id: 'hock' });                        // hock
    E(z([-0.647, 0.61, 0.185]), [0.026, 0.042, 0.025], { k: 0.025, bone: bn('mt' + S), tag: 'leg', s: 0.022 });                    // point of hock
    C(z(Hd.ho, -0.002), z(Hd.fe), 0.029, 0.026, { k: 0.02, bone: bn('mt' + S), tag: 'leg', s: 0.025 });                              // hind cannon
    E(z([-0.593, 0.38, 0.185]), [0.019, 0.155, 0.02], { k: 0.022, bone: bn('mt' + S), tag: 'leg', s: 0.025, id: 'tendonH' });
    E(z([-0.56, 0.185, 0.185]), [0.035, 0.037, 0.04], { k: 0.04, bone: bn('hpas' + S), tag: 'leg', s: 0.022 });
    for (const t of [1, -1]) C(z([-0.55, 0.16, 0.185 + 0.026 * t]), z([-0.495, 0.058, 0.185 + 0.038 * t]), 0.025, 0.023, { k: 0.016, bone: bn('hpas' + S), tag: 'leg', s: 0.025 });
    RG = rr(REG.foot, REG.footR);
    E(z([-0.498, 0.034, 0.185]), [0.098, 0.037, 0.083], { k: 0.026, bone: bn('htoe' + S), tag: 'leg', floor: 0.0, s: 0.03, id: 'padH', cs: 0.01 });
    for (const t of [1, -1]) E(z([-0.458, 0.058, 0.185 + 0.032 * t]), [0.055, 0.028, 0.031], { k: 0.02, bone: bn('htoe' + S), tag: 'leg', s: 0.03 });
    E(z([-0.498, 0.012, 0.185]), [0.102, 0.012, 0.086], { k: 0.012, bone: bn('htoe' + S), tag: 'sole', floor: 0.0, s: 0.03, cs: 0.006 });
    for (const t of [1, -1]) E(z([-0.405, 0.044, 0.185 + 0.032 * t]), [0.017, 0.011, 0.013], { k: 0.009, bone: bn('htoe' + S), tag: 'nail', cs: 0.004, s: 0.02 });
    RG = rr(REG.pad, REG.padR);
    E(z([-0.285, 0.97, 0.2]), [0.032, 0.046, 0.036], { k: 0.018, bone: bn('tib' + S), tag: 'pad', cs: 0.005, s: 0.03, id: 'stiflePad' });
    RG = rr(REG.foot, REG.footR);

  }

  /* ───── old age: sharper bones, drooping lip, sunken flanks ───── */
  if (ST.old) for (const p of prims) {
    if (p.id === 'coxa' || p.id === 'ischii') { p.r = p.r.map(v => v * 1.35); p.k *= .6; }
    if (p.id === 'lowerLip') { p.c[1] -= .014; p.r[1] *= 1.2; }
  }

  if (ST.plainHump) for (const p of prims) if (p.id && p.id.startsWith('hump')) p.tag = T('coat');

  /* ───── proportions for the life stage ───── */
  const c0 = [0.02, 1.45, 0];
  const aF = FORE.sh, aH = HIND.hip, aN = NECK[0], aT = [-0.8, 1.6, 0], aHump = [-0.04, 1.7, 0];
  const bodyT = p => [c0[0] + ST.sB * (p[0] - c0[0]), c0[1] + ST.sB * (p[1] - c0[1]), c0[2] + ST.sB * (p[2] - c0[2])];
  const hipB = bodyT([aH[0], aH[1], 0]);
  const lift = ST.sL * aH[1] - hipB[1];
  const shB = bodyT([aF[0], aF[1], 0]);
  const sLyF = (shB[1] + lift) / aF[1];
  const up = p => [p[0], p[1] + lift, p[2]];
  const neckB = up(bodyT(aN));
  const pollN = [neckB[0] + ST.sN * (POLL[0] - aN[0]), neckB[1] + ST.sN * (POLL[1] - aN[1]), 0];
  const X = {
    body: { f: p => up(bodyT(p)), s: ST.sB },
    hump: { f: p => { const q = up(bodyT(aHump)); const h = ST.hump; return [q[0] + ST.sB * h[0] * (p[0] - aHump[0]), q[1] + ST.sB * h[1] * (p[1] - aHump[1]), q[2] + ST.sB * h[2] * (p[2] - aHump[2])]; }, s: ST.sB, v: ST.hump },
    neck: { f: p => [neckB[0] + ST.sN * (p[0] - aN[0]), neckB[1] + ST.sN * (p[1] - aN[1]), ST.sN * p[2]], s: ST.sN },
    head: { f: p => [pollN[0] + ST.sH * (p[0] - POLL[0]), pollN[1] + ST.sH * (p[1] - POLL[1]), ST.sH * p[2]], s: ST.sH },
    tail: { f: p => { const q = up(bodyT(aT)); return [q[0] + ST.sB * (p[0] - aT[0]), q[1] + ST.sL * (p[1] - aT[1]), q[2] + ST.sB * p[2]]; }, s: ST.sB },
  };
  for (const [S, sd] of [['L', 1], ['R', -1]]) {
    const A = [aF[0], aF[1], aF[2] * sd], Ab = up(bodyT(A)), Hh = [aH[0], aH[1], aH[2] * sd], Hb = up(bodyT(Hh));
    X['fore' + S] = { f: p => [Ab[0] + ST.sL * (p[0] - A[0]), Ab[1] + sLyF * (p[1] - A[1]), Ab[2] + ST.sL * (p[2] - A[2])], s: ST.sL };
    X['hind' + S] = { f: p => [Hb[0] + ST.sL * (p[0] - Hh[0]), Hb[1] + ST.sL * (p[1] - Hh[1]), Hb[2] + ST.sL * (p[2] - Hh[2])], s: ST.sL };
  }
  for (const p of prims) {
    const x = X[p.g], s = x.s;
    if (p.t === 0) {
      p.c = x.f(p.c);
      p.r = x.v ? p.r.map((r, i) => r * s * x.v[i]) : p.r.map(r => r * s);
    } else { p.a = x.f(p.a); p.b = x.f(p.b); p.ra *= s; p.rb *= s; }
    p.k *= s; if (p.s) p.s *= s; if (p.cs) p.cs *= s;
    if (p.floor !== undefined) p.floor = x.f([0, p.floor, 0])[1];
  }
  for (const b of bones) b.p = X[b.g].f(b.p);
  for (const k in anchors) anchors[k].p = X[anchors[k].g].f(anchors[k].p);

  /* ───── morph variants ───── */
  const clone = () => prims.map(p => JSON.parse(JSON.stringify(p)));
  const variants = [];
  const hs = ST.sB;
  { // hump full: fat reserves topped up
    const V = clone(), ch = [];
    V.forEach((p, i) => { if (p.id && p.id.startsWith('hump')) { p.r = p.r.map((r, j) => r * [1.08, 1.2, 1.12][j]); p.c[1] += 0.035 * hs; ch.push(i); } });
    variants.push({ name: 'humpFull', prims: V, changed: ch });
  }
  { // hump spent: slumps, shrinks and falls to one side
    const V = clone(), ch = [];
    V.forEach((p, i) => {
      if (!p.id || !p.id.startsWith('hump')) return;
      p.r = p.r.map((r, j) => r * [0.9, 0.36, 0.86][j]); p.c[1] -= (p.id === 'humpDome' ? 0.13 : 0.05) * hs;
      if (p.id === 'humpDome') { p.c[2] += 0.07 * hs; p.m = rotInv(24, 0, 0); p.c[1] += 0.01 * hs; }
      ch.push(i);
    });
    variants.push({ name: 'humpEmpty', prims: V, changed: ch, margin: 0.2 });
  }
  { // thin: dehydrated / underfed — tucked flank, sharper hips, visible ribs
    const V = clone(), ch = [];
    V.forEach((p, i) => {
      if (p.reg === REG.belly) { p.r = p.r.map((r, j) => r * [1, 0.9, 0.88][j]); p.c[1] += 0.03 * hs; ch.push(i); }
      if (p.id === 'coxa' || p.id === 'ischii') { p.r = p.r.map(r => r * 1.3); p.k *= 0.5; ch.push(i); }
    });
    for (const sd of [1, -1]) for (let r = 0; r < 6; r++) {
      const x = 0.24 - r * 0.1;
      V.push({ t: 1, a: X.body.f([x + 0.02, 1.72, 0.22 * sd]), b: X.body.f([x - 0.06, 1.2, 0.27 * sd]), ra: 0.018 * hs, rb: 0.016 * hs, op: 1, k: 0.03 * hs, g: 'body', reg: REG.body, tag: T('coat'), bone: bn('chest') });
      ch.push(V.length - 1);
    }
    variants.push({ name: 'thin', prims: V, changed: ch, margin: 0.1 });
  }
  { // male: no udder; the scrotum high in the perineum and the prepuce under the belly
    const V = clone(), ch = [];
    V.forEach((p, i) => { if (p.id === 'udder' || p.id === 'teat') { if (p.t === 0) { p.r = p.r.map(r => r * .2); p.c[1] += .06 * hs; } else { p.ra *= .2; p.rb *= .2; p.a[1] += .08 * hs; p.b[1] += .1 * hs; } ch.push(i); } });
    for (const sd of [1, -1]) { V.push({ t: 0, c: X.body.f([-0.79, 1.29, 0.03 * sd]), r: [0.05 * hs, 0.042 * hs, 0.034 * hs], k: 0.03 * hs, g: 'body', reg: REG.body, tag: T('coatLite'), bone: bn('pelvis') }); ch.push(V.length - 1); }
    V.push({ t: 0, c: X.body.f([-0.12, 1.13, 0]), r: [0.07 * hs, 0.035 * hs, 0.032 * hs], k: 0.04 * hs, g: 'body', reg: REG.belly, tag: T('coatLite'), bone: bn('root') }); ch.push(V.length - 1);
    variants.push({ name: 'male', prims: V, changed: ch, margin: 0.12, downRegion: REG.udder });
  }
  { // nostrils sealed against blowing sand
    const V = clone(), ch = [];
    V.forEach((p, i) => { if (p.id === 'nostril') { p.r = [p.r[0] * 0.9, p.r[1] * 0.2, p.r[2] * 0.3]; ch.push(i); } });
    variants.push({ name: 'nostrilClosed', prims: V, changed: ch, margin: 0.03 });
  }

  /* tags → linear colours with the stage tint */
  const tags = TAG_NAMES.map(n => {
    const t = CAMEL_TAGS[n], c = hexLin(n === 'muzzle' && ST.old ? '#bdb2a4' : t.hex);
    return { color: c.map((v, i) => v * ST.tint[i]), hair: t.hair * (t.hair > 0.3 ? ST.hair : 1), region: 0 };
  });

  // unions first, then subtractions (the field is evaluated in index order); keep morph indices consistent
  const order = prims.map((p, i) => i).sort((a, b) => (prims[a].op === 1) - (prims[b].op === 1) || a - b);
  const remap = new Map(order.map((o, n) => [o, n]));
  const reorder = arr => { const out = order.map(i => arr[i]); for (let i = prims.length; i < arr.length; i++) out.push(arr[i]); return out; };
  for (const v of variants) { v.prims = reorder(v.prims); v.changed = v.changed.map(i => i < prims.length ? remap.get(i) : i); }
  const P2 = reorder(prims);

  const vox = [0.0135, 0.0105, 0.0088][quality] * ST.vox;
  let mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
  for (const p of P2) {
    if (p.op === 1) continue;
    const pts = p.t === 0 ? [[p.c, Math.max(...p.r)]] : [[p.a, p.ra], [p.b, p.rb]];
    for (const [c, r] of pts) for (let i = 0; i < 3; i++) { mn[i] = Math.min(mn[i], c[i] - r - p.k); mx[i] = Math.max(mx[i], c[i] + r + p.k); }
  }
  mn = mn.map(v => v - 3 * vox); mx = mx.map(v => v + 3 * vox); mn[1] = Math.max(mn[1], -2 * vox);
  return { stage: stageName, neck: NECK, neckR: NR, poll: POLL, headPitch: HEAD_PITCH, fore: FORE, hind: HIND, prims: P2, tags, bones, anchors, scale: { body: ST.sB, leg: ST.sL, neck: ST.sN, head: ST.sH }, variants, voxel: vox, bounds: { min: mn, max: mx }, ao: true };
}

/* ════════════════════════════════════════════════════════════════
   the living body: skinned mesh from the SDF build, coat shading,
   fur shells, eyes with lids, lashes and the third eyelid
   ════════════════════════════════════════════════════════════════ */
const GLSL_NOISE3 = `
  float h13(vec3 p){ p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
  float vn3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(h13(i), h13(i + vec3(1,0,0)), f.x), mix(h13(i + vec3(0,1,0)), h13(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(h13(i + vec3(0,0,1)), h13(i + vec3(1,0,1)), f.x), mix(h13(i + vec3(0,1,1)), h13(i + vec3(1,1,1)), f.x), f.y), f.z); }
  vec3 flowDir(vec3 n){ vec3 g = normalize(vec3(-0.55, -0.83, 0.0)); vec3 t = g - dot(g, n) * n; float l = length(t); return l > 1e-3 ? t / l : normalize(cross(n, vec3(0.0, 0.0, 1.0)) + 1e-4); }`;
const GLSL_BUMP = `
  vec3 bumpN(vec3 surf_pos, vec3 surf_norm, vec2 dHdxy, float faceDirection) {
    vec3 vSigmaX = normalize(dFdx(surf_pos.xyz)); vec3 vSigmaY = normalize(dFdy(surf_pos.xyz)); vec3 vN = surf_norm;
    vec3 R1 = cross(vSigmaY, vN); vec3 R2 = cross(vN, vSigmaX);
    float fDet = dot(vSigmaX, R1) * faceDirection;
    vec3 vGrad = sign(fDet) * (dHdxy.x * R1 + dHdxy.y * R2);
    return normalize(abs(fDet) * surf_norm - vGrad); }`;
/* skin disease looks (awareness only, never gory): mange, pox, ringworm, ticks, sore pads, reddening */
const LES_GLSL = `
  uniform float uLesK, uLesReg[20], uMale;
  float lesReg(){ int r = int(vRegion + 0.5); float m = 0.0; for (int i = 0; i < 20; i++) if (i == r) m = uLesReg[i]; return m; }
  // returns x: hairless amount, y: crust/scab amount, z: raised relief, w: redness
  vec4 lesion(vec3 P){
    if (uLesK < 0.5) return vec4(0.0);
    float m = lesReg();
    if (m < 0.01) return vec4(0.0);
    if (uLesK < 1.5) {                                   // sarcoptic mange: patchy hair loss, thickened, wrinkled grey skin and crusts
      float a = smoothstep(0.5, 0.66, vn3(P * 16.0) * 0.65 + vn3(P * 45.0) * 0.35);
      float wr = sin(dot(P, vec3(420.0, 230.0, 330.0)) + vn3(P * 70.0) * 5.0) * 0.5 + 0.5;
      return vec4(a * 0.9, a * 0.35 * wr, a * wr * 0.35, a * 0.12) * m;
    }
    if (uLesK < 2.5) {                                   // camelpox: papules, pustules and dark scabs ~1 cm
      vec3 q = P * 70.0, id = floor(q), f = fract(q) - 0.5;
      float on = step(0.5, h13(id)), d = length(f - (vec3(h13(id + 3.1), h13(id + 5.7), h13(id + 9.2)) - 0.5) * 0.4);
      float spot = on * smoothstep(0.36, 0.22, d), core = on * smoothstep(0.15, 0.05, d);
      return vec4(spot * 0.8, core, spot * 1.3, spot * (1.0 - core)) * m;
    }
    if (uLesK < 3.5) {                                   // ringworm: round, dry, greyish, hairless patches 3–6 cm
      vec3 q = P * 7.5, id = floor(q), f = fract(q) - 0.5;
      float on = step(0.55, h13(id + 1.7)), rr = 0.2 + 0.12 * h13(id + 6.1);
      float d = length(f - (vec3(h13(id + 2.1), h13(id + 4.3), h13(id + 8.8)) - 0.5) * 0.35) + (vn3(P * 60.0) - 0.5) * 0.08;
      float patch2 = on * smoothstep(rr, rr - 0.05, d);
      return vec4(patch2, patch2 * (0.45 + 0.4 * vn3(P * 140.0)), patch2 * 0.35, 0.0) * m;
    }
    if (uLesK < 4.5) {                                   // ticks: small dark bodies clustered on thin skin
      vec3 q = P * 110.0, id = floor(q), f = fract(q) - 0.5;
      float on = step(0.84, h13(id + 4.4)) * smoothstep(0.3, 0.55, vn3(P * 9.0));
      float t = on * smoothstep(0.28, 0.16, length(f));
      return vec4(0.0, t, t * 1.4, 0.0) * m;
    }
    if (uLesK < 5.5) {                                   // sore, cracked pads: raw patches and deep fissures
      float c = smoothstep(0.5, 0.68, vn3(P * 30.0));
      float cr = smoothstep(0.035, 0.0, abs(vn3(P * 55.0) - 0.5));
      return vec4(0.0, cr * 0.6, c * 0.4 - cr * 0.6, max(c, cr)) * m;
    }
    return vec4(0.0, 0.0, 0.0, 0.8) * m;                 // reddening (inflamed udder skin)
  }`;
const HEAT_GLSL = `
  vec3 heatPal(float t){ t = clamp(t, 0.0, 1.0);
    vec3 c0 = vec3(0.02,0.01,0.09), c1 = vec3(0.16,0.02,0.33), c2 = vec3(0.55,0.06,0.33),
         c3 = vec3(0.9,0.27,0.12), c4 = vec3(1.0,0.62,0.12), c5 = vec3(1.0,0.95,0.7);
    float s = t * 5.0;
    if (s < 1.0) return mix(c0, c1, s); if (s < 2.0) return mix(c1, c2, s - 1.0);
    if (s < 3.0) return mix(c2, c3, s - 2.0); if (s < 4.0) return mix(c3, c4, s - 3.0); return mix(c4, c5, s - 4.0); }`;

/* uniforms shared by every camel material (one camel on screen at a time) */
const CU = {
  uTime: { value: 0 }, uSunV: { value: new THREE.Vector3(0, 1, 0) }, uSunCol: { value: new THREE.Color(1, 1, 1) }, uSunI: { value: 1 },
  uHL: { value: Array.from({ length: 20 }, () => new THREE.Vector3()) }, uHLCol: { value: new THREE.Color('#ffb347') },
  uPeel: { value: new THREE.Vector4(0, -99, 0, 0) }, uDust: { value: 0 }, uCoat: { value: 1 }, uGrey: { value: 0 },
  uTb: { value: 37 }, uTair: { value: 30 }, uTmin: { value: 0 }, uTmax: { value: 50 }, uSolar: { value: 0 }, uSunW: { value: new THREE.Vector3(0, 1, 0) },
  uFurLen: { value: 0.012 }, uBumpS: { value: 1 }, uXray: { value: 1 }, uLeg: { value: 1 }, uInvExpo: { value: .3 }, uThin: { value: 0 }, uSB: { value: 1 }, uLesK: { value: 0 }, uLesReg: { value: new Array(20).fill(0) }, uMale: { value: 0 },
};

function camelMaterials() {
  const common = (sh, extraV = '', extraF = '') => {
    Object.assign(sh.uniforms, CU);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        attribute float hair; attribute float thin; attribute float region; attribute float vao;
        varying float vHair, vThin, vRegion, vAO; varying vec3 vRest, vRestN, vWorld;
        uniform float uShell, uFurLen, uCoat;
        ${GLSL_NOISE3}
        ${extraV}`)
      .replace('#include <beginnormal_vertex>', `#include <beginnormal_vertex>
        vec3 restN = normalize(objectNormal);`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vRest = position; vRestN = restN; vHair = hair; vThin = thin; vRegion = region; vAO = vao;`)
      .replace('#include <worldpos_vertex>', `#include <worldpos_vertex>
        vWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying float vHair, vThin, vRegion, vAO; varying vec3 vRest, vRestN, vWorld;
        uniform float uTime, uSunI, uDust, uCoat, uGrey, uBumpS, uInvExpo, uThin, uSB, uLeg; uniform vec3 uSunV, uSunCol, uHLCol; uniform vec4 uPeel; uniform vec3 uHL[20];
        ${GLSL_NOISE3}
        ${GLSL_BUMP}
        ${LES_GLSL}
        ${extraF}
        vec3 regionHL(){ int r = int(vRegion + 0.5); vec3 h = vec3(0.0);
          for (int i = 0; i < 20; i++) if (i == r) h = uHL[i];
          return h; }`)
      .replace('void main() {', `void main() {
        if (uPeel.w > 0.0 && distance(vWorld, uPeel.xyz) < uPeel.w) discard;`);
  };

  /* coat & skin: physically based, with procedural hair streaks and derivative bump */
  const skin = new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: .82, metalness: 0, sheen: .6, sheenRoughness: .55, sheenColor: new THREE.Color('#e8c99a'), specularIntensity: .45, side: THREE.DoubleSide, clippingPlanes: ANAT.clip, shadowSide: THREE.FrontSide });
  skin.onBeforeCompile = sh => {
    common(sh);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <color_fragment>', `#include <color_fragment>
        vec3 n0 = normalize(vRestN), fl = flowDir(n0), bt = normalize(cross(n0, fl));
        float hairy = clamp(vHair, 0.0, 2.2);
        int rg = int(vRegion + 0.5);
        bool isLeg = rg == 4 || rg == 5 || rg == 14 || rg == 15, isFoot = rg == 6 || rg == 16, isPad = rg == 7 || rg == 17;
        vec3 P = vRest / max(uSB, 0.01);
        float yL = vRest.y / max(uLeg, 0.01);
        // hair: fine streaks along the flow, coarser clumps where the coat is long (hump, crest, throat)
        float coarse = smoothstep(1.0, 2.0, hairy);
        float streak = vn3(vec3(dot(vRest, bt) * mix(900.0, 420.0, coarse), dot(vRest, fl) * mix(70.0, 34.0, coarse), dot(vRest, n0) * 300.0));
        float clump = vn3(vRest * mix(38.0, 22.0, coarse) + vec3(dot(vRest, fl) * 20.0));
        float patchy = vn3(vRest * 6.0) * 0.6 + vn3(vRest * 17.0) * 0.4;
        vec3 base = diffuseColor.rgb;
        float tuft = vn3(vec3(dot(vRest, bt) * 70.0, dot(vRest, fl) * 26.0, dot(vRest, n0) * 70.0));
        float shed = smoothstep(0.62, 0.78, vn3(vRest * 4.5 + 3.0)) * smoothstep(0.4, 1.2, hairy);
        base *= mix(1.0, 0.78 + 0.36 * streak, clamp(hairy, 0.45, 1.0));
        base *= 0.88 + 0.24 * patchy;
        base *= mix(1.0, 0.8 + 0.4 * tuft, min(hairy, 1.0) * 0.8);
        base = mix(base, base * vec3(1.16, 1.09, 0.97), smoothstep(0.55, 0.9, clump) * min(hairy, 1.0) * 0.7);
        base = mix(base, base * vec3(0.8, 0.74, 0.7), shed * 0.45);
        // countershading: sun-bleached, darker back; paler belly and inner legs
        base *= mix(1.0, 0.88, smoothstep(1.75, 2.1, P.y) * (1.0 - step(0.5, float(isLeg))));
        base = mix(base, base * vec3(1.16, 1.12, 1.06), smoothstep(-0.2, -0.75, n0.y) * 0.6);
        // lower legs: dust caked on the short hair, heaviest round the fetlocks
        float dustLeg = (isLeg || isFoot) ? smoothstep(0.7, 0.2, yL) * (0.55 + 0.45 * vn3(vRest * 24.0)) : 0.0;
        base = mix(base, vec3(0.6, 0.47, 0.34) * (0.9 + 0.2 * streak), dustLeg * 0.3);
        // calluses: bare, grey, cracked skin
        float cells = 0.0;
        if (isPad) {
          vec3 q = vRest * 90.0, id = floor(q), f = fract(q); float d1 = 1.0, d2 = 1.0;
          for (int k = 0; k < 8; k++) { vec3 o = vec3(float(k & 1), float((k >> 1) & 1), float((k >> 2) & 1)); vec3 r = o + vec3(h13(id + o), h13(id + o + 7.1), h13(id + o + 3.7)) - f; float d = dot(r, r); if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d; }
          cells = 1.0 - smoothstep(0.0, 0.06, sqrt(d2) - sqrt(d1));
          base *= (0.9 + 0.2 * vn3(vRest * 40.0)) * (1.0 - 0.35 * cells);
        }
        if (isFoot) base *= 0.92 + 0.12 * vn3(vRest * 60.0);
        float greyZone = max(1.0 - step(0.5, abs(vRegion - 11.0)), 0.5 * (1.0 - step(0.5, abs(vRegion - 10.0))));
        base = mix(base, vec3(dot(base, vec3(.3,.59,.11))) * vec3(1.05, 1.03, 1.0) * 1.15, uGrey * greyZone * 0.75);
        base = mix(base, vec3(0.62, 0.5, 0.36), uDust * smoothstep(0.1, 0.9, n0.y) * 0.55);
        if (uMale > 0.5 && rg == 9) base = mix(base, vec3(0.6, 0.45, 0.31), 0.6);
        vec4 les = lesion(vRest);
        base = mix(base, vec3(0.42, 0.35, 0.3) * (0.85 + 0.3 * streak), les.x * 0.5);             // bare, greyish skin
        vec3 crust = uLesK < 1.5 ? vec3(0.34, 0.29, 0.26) : uLesK < 2.5 ? vec3(0.2, 0.13, 0.1) : uLesK < 3.5 ? vec3(0.6, 0.56, 0.5) : uLesK < 4.5 ? vec3(0.16, 0.12, 0.1) : vec3(0.22, 0.12, 0.1);
        base = mix(base, crust, les.y * 0.8);
        base = mix(base, vec3(0.66, 0.26, 0.22), les.w * 0.55);
        diffuseColor.rgb = gl_FrontFacing ? base : vec3(0.5, 0.13, 0.1);
        // relief drawn by hand: ribs under the flank, folds of loose skin on the neck, creases at the knee, tendons
        float hH = streak * 0.35 * max(min(hairy, 1.0), 0.5) + clump * 0.45 + tuft * 0.8 * min(hairy, 1.0) - shed * 0.5;
        float relief = (vn3(vRest * 260.0) - 0.5) * (1.0 - min(hairy, 1.0)) * 0.9;
        if (rg == 0 || rg == 13) {
          float rib = sin((P.x + (P.y - 1.2) * 0.32) / 0.093 * 6.2831) * 0.5 + 0.5;
          float m = smoothstep(0.1, 0.27, abs(P.z)) * smoothstep(1.02, 1.32, P.y) * smoothstep(1.72, 1.44, P.y) * smoothstep(-0.4, -0.1, P.x) * smoothstep(0.56, 0.26, P.x);
          relief += rib * m * mix(0.35, 1.4, uThin);
        }
        if (rg == 2) {
          float fold = sin(P.x / 0.047 * 6.2831 + vn3(vRest * 9.0) * 5.0) * 0.5 + 0.5;
          float m = smoothstep(0.15, -0.35, n0.y) * smoothstep(0.62, 0.75, P.x) * smoothstep(1.42, 1.25, P.x);
          relief += pow(fold, 3.0) * m * 1.3;
        }
        if (isLeg) {
          float knee = smoothstep(0.06, 0.0, abs(yL - 0.66)) + smoothstep(0.05, 0.0, abs(yL - 0.2)) * 0.7;
          relief += pow(sin(yL / 0.011 * 6.2831) * 0.5 + 0.5, 2.0) * knee * smoothstep(0.1, 0.5, abs(n0.x)) * 0.8;
          // the groove between the cannon bone and the flexor tendons behind it
          float fore = (rg == 4 || rg == 14) ? 1.0 : 0.0;
          float tt = clamp((yL - 0.19) / 0.42, 0.0, 1.0);
          float ax = mix(mix(-0.565, -0.6, tt) - 0.012, mix(0.64, 0.632, tt) - 0.017, fore);
          float cannon = smoothstep(0.2, 0.26, yL) * smoothstep(0.6, 0.54, yL);
          relief -= exp(-pow((vRest.x - ax) / 0.0055, 2.0)) * cannon * smoothstep(0.3, 0.7, abs(n0.z)) * 1.6;
          relief += (vn3(vec3(vRest.x * 160.0, vRest.y * 8.0, vRest.z * 160.0)) - 0.5) * smoothstep(0.55, 0.3, yL) * 0.4;
        }
        if (isPad) relief -= cells * 0.8;
        hH += relief * 1.6 + les.z * 2.2;`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        {
          float wet = (rg == 11) ? smoothstep(0.45, 0.52, vRest.x / max(uSB, 0.01) - 1.1) : 0.0;
          roughnessFactor = mix(0.55, 0.88, clamp(vHair * 1.4, 0.0, 1.0)) - vThin * 0.05;
          roughnessFactor = isPad ? 0.93 : roughnessFactor;
          roughnessFactor = mix(roughnessFactor, 0.93, dustLeg * 0.6);
          roughnessFactor = mix(roughnessFactor, 0.62, wet * (1.0 - step(0.3, vHair)));
          roughnessFactor = mix(roughnessFactor, 0.95, max(les.x, les.y));
        }`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        {
          float fade = uBumpS * (1.0 - smoothstep(0.004, 0.02, length(fwidth(vRest))));
          vec2 dh = vec2(dFdx(hH), dFdy(hH)) * 0.0016 * fade;
          normal = bumpN(-vViewPosition, normal, dh, faceDirection);
        }`)
      .replace('#include <lights_physical_fragment>', `#include <lights_physical_fragment>
        #ifdef USE_SHEEN
          material.sheenColor *= clamp(vHair, 0.0, 1.0);
        #endif`)
      .replace('#include <aomap_fragment>', `#include <aomap_fragment>
        reflectedLight.indirectDiffuse *= vAO; reflectedLight.indirectSpecular *= vAO;
        reflectedLight.directDiffuse *= mix(1.0, vAO, 0.35);`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        {
          float back = pow(max(dot(normalize(vViewPosition), -uSunV) * 0.5 + 0.5, 0.0), 3.0);
          float sssW = (1.0 - step(0.5, abs(vRegion - 12.0))) * 0.1;
          totalEmissiveRadiance += vec3(0.9, 0.28, 0.12) * uSunCol * uSunI * vThin * back * 0.18 * sssW;
          vec3 hl = regionHL();
          float fr = pow(1.0 - abs(dot(normalize(vViewPosition), normal)), 2.0);
          totalEmissiveRadiance += hl * (0.12 + 0.55 * fr) * (0.85 + 0.15 * sin(uTime * 3.0)) * uInvExpo;
        }`);
  };

  /* fur shells: the same skinned surface pushed out along its rest normal, strands carved by alpha test */
  const shell = n => {
    const m = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .92, metalness: 0, clippingPlanes: ANAT.clip });
    m.userData.layer = n;
    m.onBeforeCompile = sh => {
      sh.uniforms.uShell = { value: n };
      common(sh);
      sh.vertexShader = sh.vertexShader.replace('#include <skinning_vertex>', `
        {
          float len = uFurLen * uCoat * max(vHair, 0.0);
          vec3 fl = flowDir(restN);
          transformed += (restN * 0.85 + fl * 0.55 * uShell) * uShell * len;
        }
        #include <skinning_vertex>`);
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', '#include <common>\nuniform float uShell;')
        .replace('#include <color_fragment>', `#include <color_fragment>
          {
            if (vHair < 0.12) discard;
            { vec4 ls = lesion(vRest); if (ls.x > 0.35 || ls.y > 0.5) discard; }
            vec3 fl = flowDir(normalize(vRestN)), n0 = normalize(vRestN), bt = normalize(cross(n0, fl));
            float coarse = smoothstep(1.0, 2.0, vHair);
            vec3 q = vec3(dot(vRest, bt) * mix(520.0, 300.0, coarse), dot(vRest, fl) * mix(150.0, 80.0, coarse), dot(vRest, n0) * mix(520.0, 300.0, coarse));
            vec3 cell = floor(q), f = fract(q) - 0.5;
            float r = h13(cell), len = 0.35 + 0.65 * r;
            float px = length(fwidth(vRest));                       // strands smaller than a pixel only sparkle: fade the shells out
            if (h13(cell + 7.0) < smoothstep(0.0022, 0.0055, px)) discard;
            float thick = (1.0 - uShell / len) * 0.5;
            if (uShell > len || length(f.xz) > thick || vn3(vRest * 70.0) < 0.18 * uShell) discard;
            float coat = mix(0.6, 0.98, uShell) * (0.86 + 0.26 * r);
            diffuseColor.rgb *= coat;
            diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.62, 0.5, 0.36), uDust * uShell * 0.6);
          }`)
        .replace('#include <aomap_fragment>', `#include <aomap_fragment>
          reflectedLight.indirectDiffuse *= mix(vAO, 1.0, uShell * 0.6); reflectedLight.directDiffuse *= mix(0.55, 1.0, uShell);`);
    };
    m.customProgramCacheKey = () => 'shell';
    return m;
  };

  /* muscle layer: same surface, read as the muscles under the skin */
  const muscle = new THREE.MeshStandardMaterial({ roughness: .55, metalness: 0, color: '#ffffff', side: THREE.DoubleSide, clippingPlanes: ANAT.clip, shadowSide: THREE.FrontSide });
  muscle.onBeforeCompile = sh => {
    common(sh);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <color_fragment>', `#include <color_fragment>
        vec3 fl = flowDir(normalize(vRestN)), bt = normalize(cross(normalize(vRestN), fl));
        int rg = int(vRegion + 0.5);
        float fib = vn3(vec3(dot(vRest, bt) * 260.0, dot(vRest, fl) * 12.0, 0.0));
        float sheet = smoothstep(0.35, 0.75, vn3(vRest * 9.0));
        vec3 red = mix(vec3(0.42, 0.08, 0.07), vec3(0.62, 0.16, 0.12), fib);
        vec3 tendon = vec3(0.86, 0.8, 0.72) * (0.9 + 0.1 * fib);
        vec3 fat = vec3(0.93, 0.8, 0.52);
        vec3 c = red;
        if (rg == 6 || rg == 7 || rg == 16 || rg == 17) c = vec3(0.35, 0.3, 0.27);                    // feet and pads: horn and callus
        if (rg == 3) c = mix(fat, fat * 0.9, fib);                            // hump: fat, not muscle
        float lowleg = (rg == 4 || rg == 5 || rg == 14 || rg == 15) ? smoothstep(0.75, 0.55, vWorld.y / max(uLeg, 0.01)) : 0.0;
        c = mix(c, tendon, max(lowleg, sheet * 0.12));
        diffuseColor.rgb = gl_FrontFacing ? c : vec3(0.45, 0.1, 0.08);
        float hH = fib;`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        normal = bumpN(-vViewPosition, normal, vec2(dFdx(hH), dFdy(hH)) * 0.0025, faceDirection);`)
      .replace('#include <aomap_fragment>', `#include <aomap_fragment>
        reflectedLight.indirectDiffuse *= vAO;`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        totalEmissiveRadiance += regionHL() * 0.35 * uInvExpo;`);

  };

  /* x-ray ghost: a fresnel veil so the organs and skeleton read through the body */
  const xray = new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, color: '#ffffff', clippingPlanes: ANAT.clip });
  xray.onBeforeCompile = sh => {
    common(sh, '', 'uniform float uXray;');
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vNV; varying vec3 vVV;')
      .replace('#include <fog_vertex>', `#include <fog_vertex>
        vNV = normalize(normalMatrix * objectNormal); vVV = -mvPosition.xyz;`);
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vNV; varying vec3 vVV;')
      .replace('#include <color_fragment>', `#include <color_fragment>
        float f = 1.0 - abs(dot(normalize(vNV), normalize(vVV)));
        float a = (0.06 + pow(f, 2.0) * 0.72) * uXray;
        diffuseColor = vec4(mix(vec3(0.55, 0.72, 0.95), vec3(1.0, 0.93, 0.8), f) * (0.4 + 0.6 * f), a);
        vec3 hl = regionHL(); diffuseColor.rgb += hl * 0.5; diffuseColor.a += max(hl.r, max(hl.g, hl.b)) * 0.12 * uXray;
        diffuseColor.rgb *= uInvExpo;`);
    sh.uniforms.uXray = CU.uXray;
  };

  /* thermal camera: surface temperature from body core, coat insulation and sunlight */
  const thermal = new THREE.MeshBasicMaterial({ color: '#ffffff', fog: false });
  thermal.onBeforeCompile = sh => {
    common(sh, '', `uniform float uTb, uTair, uTmin, uTmax, uSolar; uniform vec3 uSunW; ${HEAT_GLSL}`);
    Object.assign(sh.uniforms, { uTb: CU.uTb, uTair: CU.uTair, uTmin: CU.uTmin, uTmax: CU.uTmax, uSolar: CU.uSolar, uSunW: CU.uSunW });
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vNW;')
      .replace('#include <fog_vertex>', `#include <fog_vertex>
        vNW = normalize(mat3(modelMatrix) * objectNormal);`);
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vNW;')
      .replace('#include <color_fragment>', `#include <color_fragment>
        float ins = clamp(vHair / 1.4, 0.0, 1.0);
        float sun = max(dot(normalize(vNW), uSunW), 0.0);
        float T = mix(uTb - 0.6, uTair, ins * 0.55) + uSolar * sun * (0.25 + ins);
        T += (vn3(vRest * 40.0) - 0.5) * 0.5;
        float tn = clamp((T - uTmin) / (uTmax - uTmin), 0.0, 0.985);
        diffuseColor.rgb = vec3(-log(1.0 - tn) / 1.6) * uInvExpo;   // decoded by the thermal pass: 1 - exp(-1.6 l · exposure) = tn`);
  };
  thermal.toneMapped = false;
  return { skin, shell, muscle, xray, thermal };
}

/* ─────────── eye texture: very dark brown iris, horizontal oval pupil ─────────── */
function eyeTexture() {
  const W = 512, H = 256, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), img = x.createImageData(W, H), d = img.data;
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const u = i / W * TAU, v = j / H;                     // v = 0 at the front pole
    const ax = .19, ay = .095, rp = ax * ay / Math.sqrt(sq(ay * Math.cos(u)) + sq(ax * Math.sin(u)));
    const ri = .56;
    let r, g, b;
    if (v < rp) { r = 6; g = 5; b = 5; }
    else if (v < ri) {
      const t = (v - rp) / (ri - rp), st = .5 + .5 * Math.sin(u * 70 + Math.sin(u * 13) * 3) * Math.sin(u * 23 + t * 6);
      const L = 9 + 14 * t + 12 * st * (1 - t);
      r = L * 1.35; g = L * .95; b = L * .7;
      if (t > .88) { const e = (t - .88) / .12; r *= 1 - e * .6; g *= 1 - e * .6; b *= 1 - e * .6; }
    } else { const t = (v - ri) / (1 - ri); r = 150 - 60 * t; g = 128 - 55 * t; b = 110 - 45 * t; }
    const o = (j * W + i) * 4; d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}

class Camel {
  constructor(res, spec, mats) {
    this.spec = spec; this.res = res; this.M = mats;
    this.group = new THREE.Group(); this.group.name = 'camel';
    // skeleton (rest pose: every bone unrotated, positioned at its joint)
    this.bones = []; this.bone = {};
    for (const b of spec.bones) {
      const bone = new THREE.Bone(); bone.name = b.name;
      bone.userData.rest = new V3(...b.p);
      this.bones.push(bone); this.bone[b.name] = bone;
    }
    spec.bones.forEach((b, i) => {
      const bone = this.bones[i];
      if (b.parent) { const par = this.bone[b.parent]; par.add(bone); bone.position.copy(bone.userData.rest).sub(par.userData.rest); }
      else { this.group.add(bone); bone.position.copy(bone.userData.rest); }
      bone.userData.restPos = bone.position.clone();
    });
    this.group.updateMatrixWorld(true);
    // geometry
    const g = new THREE.BufferGeometry(), n = res.count;
    g.setAttribute('position', new THREE.BufferAttribute(res.pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(res.nor, 3));

function updateCallouts(dt) {

  const setSheet = k => { U.sheet = k; root.style.setProperty('--sheet-h', sheetSizes()[k] + 'px'); setTimeout(() => applyViewOffset(), 360); };
  setSheet('half');
  let drag = null;
  const hnd = $('#sheetHandle');
  hnd.addEventListener('pointerdown', e => { drag = { y: e.clientY, h: $('#panel').getBoundingClientRect().height, moved: 0 }; hnd.setPointerCapture(e.pointerId); document.body.classList.add('dragging-sheet'); });
  hnd.addEventListener('pointermove', e => { if (!drag) return; const h = clamp(drag.h + drag.y - e.clientY, 80, innerHeight * .85); drag.moved += Math.abs(e.movementY || 0); root.style.setProperty('--sheet-h', h + 'px'); });
  const end = e => { if (!drag) return; document.body.classList.remove('dragging-sheet'); const h = $('#panel').getBoundingClientRect().height, S = sheetSizes(); const moved = Math.abs(e.clientY - drag.y) > 6; drag = null; if (!moved) { setSheet(U.sheet === 'half' ? 'full' : U.sheet === 'full' ? 'peek' : 'half'); return; } const k = Object.keys(S).reduce((a, b) => Math.abs(S[a] - h) < Math.abs(S[b] - h) ? a : b); setSheet(k); };
  hnd.addEventListener('pointerup', end); hnd.addEventListener('pointercancel', end);
  hnd.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSheet(U.sheet === 'half' ? 'full' : U.sheet === 'full' ? 'peek' : 'half'); } });
  // keyboard
  addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (e.key === 'Escape') { if (!$('#search').hidden) SEARCH.close(); else if (!$('#keys').hidden) $('#keys').hidden = true; else if (TOURX.on) TOURX.stop(); else if (U.topic) closeTopic(); return; }
    if (tag === 'input' && e.target.type !== 'range' || tag === 'textarea' || !$('#search').hidden || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.code;
    if (e.key === '/' || k === 'Slash') { e.preventDefault(); SEARCH.open(); return; }
    if (/^Digit[1-8]$/.test(k)) { go(CHAPTERS[+k.slice(5) - 1].id); return; }
    if (k === 'Space' && tag !== 'button') { e.preventDefault(); setPlaying(!STATE.playing); return; }
    if (k === 'ArrowRight' || k === 'ArrowLeft') { if (tag === 'input') return; const d = (k === 'ArrowRight') !== (root.dir === 'rtl') ? .25 : -.25; setPlaying(false); setHour(STATE.hour + d); return; }
    if (k === 'KeyW') { const n = { stand: 'walk', walk: 'pace', pace: 'stand' }[STATE.gait]; if (U.chapter !== 'movement') go('movement'); setGait(n); focusCam(VIEWS.movement, true); return; }
    if (k === 'KeyK') { ACT.couch(); return; }
    if (k === 'KeyD') { ACT.drink(); return; }
    if (k === 'KeyS') { ACT.storm(); return; }
    if (k === 'KeyX') { if (U.chapter !== 'anatomy') go('anatomy'); STATE.explode = STATE.explode > .5 ? 0 : 1; if (STATE.explode > .5) setLayer('organs'); renderPanel(); return; }
    if (k === 'KeyL') { const order = ['skin', 'muscle', 'organs', 'skeleton']; if (U.chapter !== 'anatomy') go('anatomy'); setLayer(order[(order.indexOf(STATE.layer) + 1) % order.length]); return; }

  });
  // user camera input stops following for a while
  $('#gl').addEventListener('pointerdown', () => { U.userT = performance.now(); });
  $('#gl').addEventListener('wheel', () => { U.userT = performance.now(); }, { passive: true });
  // peel window follows the pointer

  addEventListener('resize', () => { drawDay(true); applyViewOffset(); });
  document.body.classList.toggle('dock-off', false);
  // deep link
  let hash = ''; try { hash = decodeURIComponent(location.hash.slice(1)); } catch (e) { /* no hash */ }
  const [hc, ht] = hash.split(/[./~]/);
  return { chapter: CHAPTERS.find(c => c.id === hc) ? hc : 'home', topic: ht || null };
}

/* ════════════════════════════════════════════════════════════════
   main: actions, boot, the frame loop
   ════════════════════════════════════════════════════════════════ */
const ACT = {
  couch(force) {
    const want = force === undefined ? !STATE.couched : !!force;
    if (want === STATE.couched) return;
    if (want) { if (STATE.gait !== 'stand') setGait('stand'); if (STATE.drink) return; }
    STATE.couched = want;
    toast(want ? UI.toast.couch : UI.toast.rise);
    const b = $('#actCouch'); if (b) b.innerHTML = ic('couch') + tt(want ? MOVEMENT.rise : MOVEMENT.couch);
  },
  drink() {
    if (STATE.drink || !WORLD.camel) return;
    setGait('stand');
    if (STATE.couched) ACT.couch(false);
    const s = WORLD.camel.spec.scale.body;
    STATE.drink = { t: 0, dur: 12, from: STATE.loss, lead: STATE.couched ? 3 : .4 };
    const p = localToWorldPt([1.6 * s + .12, 0, 0]);
    WORLD.trough.g.position.set(p.x, terrainH(p.x, p.z) - .02, p.z);
    WORLD.trough.g.rotation.y = camelFrame().yaw;
    WORLD.trough.g.scale.setScalar(.01); WORLD.trough.g.visible = true; WORLD.trough.setLevel(1);
    toast(UI.toast.drink, 4000);
    INSET.show('rbc');
  },
  storm() { if (STATE.stormT > 0) { ACT.stopStorm(); return; } STATE.stormT = 16; toast(UI.toast.storm, 4000); },
  stopStorm(now) { STATE.stormT = 0; if (now) STATE.storm = 0; },
};
STATE.stormT = 0;

const _cv = new V3();
let lastT = 0, fpsAcc = 0, fpsN = 0, lowFor = 0, qualityStep = 0, readoutT = 0, clockT = 0;
const QUALITY_STEPS = [
  () => { renderer.setPixelRatio(1); onResize(); },
  () => { Q.ssao = false; WORLD.camel && WORLD.camel.shells.forEach((m, i) => { if (i % 2) m.visible = false; }); Q.shells = Math.ceil(Q.shells / 2); },
  () => { Q.dof = false; Q.shells = 0; for (const k in WORLD.stages) WORLD.stages[k].camel.shells.forEach(m => { m.visible = false; }); },
];

function onResize() {
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H, false);
  const pr = renderer.getPixelRatio();
  post.setSize(Math.round(W * pr), Math.round(H * pr));
  camera.aspect = W / H; camera.updateProjectionMatrix();
  if (typeof applyViewOffset === 'function' && WORLD.camel) applyViewOffset();
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(window.__maxDt || .05, Math.max(.001, (now - (lastT || now)) / 1000)); lastT = now;
  const t = now / 1000;
  // adaptive quality: step down if we stay slow
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 2) { const fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; lowFor = fps < 26 ? lowFor + 1 : 0; if (lowFor >= 2 && qualityStep < QUALITY_STEPS.length && document.visibilityState === 'visible') { QUALITY_STEPS[qualityStep++](); lowFor = 0; if (qualityStep === 1) toast(UI.toast.quality); } }
  // clock
  tweenHour(dt);
  if (STATE.playing) { STATE.hour = wrap24(STATE.hour + dt * (ENV.reduce ? .25 : .55)); clockT += dt; if (clockT > .05) { clockT = 0; drawDay(); } }
  // storm and drink timelines
  if (STATE.stormT > 0) STATE.stormT -= dt;
  STATE.storm = damp(STATE.storm, STATE.stormT > 0 ? 1 : 0, STATE.stormT > 0 ? .9 : .6, dt);
  if (STATE.storm < .002 && STATE.stormT <= 0) STATE.storm = 0;
  const D = STATE.drink;
  if (D) {
    D.t += dt;
    const k = clamp((D.t - D.lead - 1.6) / (D.dur - D.lead - 3.4), 0, 1);
    WORLD.trough.g.scale.setScalar(damp(WORLD.trough.g.scale.x, D.t < D.dur - .6 ? 1 : .01, 5, dt));
    WORLD.trough.setLevel(1 - k * .85);
    STATE.loss = lerp(D.from, 0, easeOut(k));
    const lr = $('#lossR'); if (lr) { lr.value = STATE.loss; pctRange(lr); $('#lossOut').textContent = pct(STATE.loss); }
    if (D.t > D.dur) { STATE.drink = null; WORLD.trough.g.visible = false; drawDay(true); }
  }
  // the body
  const cam = WORLD.camel, crig = WORLD.crig;
  if (cam && crig) {
    const drinking = D && D.t > D.lead && D.t < D.dur - 1.4;
    U.nictT = Math.max(0, U.nictT - dt);
    crig.update(dt, { couch: STATE.couched, drink: drinking, storm: STATE.storm, nostril: 0, nict: U.nictT > 0 ? Math.sin(Math.PI * clamp((3.2 - U.nictT) / 1.4, 0, 1)) * .95 : 0 });
    MODEL3D.update();
    const h = STATE.hump / 100;
    cam.setMorph('humpFull', smooth(.62, 1, h));
    cam.setMorph('humpEmpty', smooth(.5, 0, h) + (STATE.stage === 'old' ? .25 : 0));
    const thin = clamp(smooth(8, 26, STATE.loss) * .85 + (STATE.stage === 'old' ? .35 : 0), 0, 1);
    cam.setMorph('thin', thin); CU.uThin.value = thin; CU.uSB.value = cam.spec.scale.body;
    CU.uMale.value = damp(CU.uMale.value, STATE.sex === 'm' ? 1 : 0, 6, dt); cam.setMorph('male', CU.uMale.value);
    // contact occlusion: where the pads and the barrel meet the sand
    const sB = cam.spec.scale.body, sL = cam.spec.scale.leg;
    ['toeL', 'toeR', 'htoeL', 'htoeR'].forEach((n, i) => { const b = cam.bone[n]; b.getWorldPosition(_cv); CONTACT.feet[i].set(_cv.x, _cv.y - terrainH(_cv.x, _cv.z) - .045 * sL, _cv.z, .115 * sL); });
    cam.bone.root.getWorldPosition(_cv);
    CONTACT.body.set(_cv.x, _cv.y - terrainH(_cv.x, _cv.z) - .36 * sB, _cv.z, 0);
    CONTACT.ax.set(Math.cos(crig.yaw), -Math.sin(crig.yaw), .85 * sB, smooth(1.2, 2.8, crig.couch));
    // anatomy
    ANAT.update(dt);
    if (ANAT.built && STATE.stage === 'adult') {
      const peelOn = U.peel && U.chapter === 'anatomy';
      ANAT.organs.forEach(o => { o.holder.visible = (STATE.layer === 'organs' || peelOn) && (!o.sex || o.sex === STATE.sex); });
      ANAT.bones.forEach(b => { b.mesh.visible = STATE.layer === 'skeleton' || STATE.layer === 'organs' || peelOn; });
      if (U.section && U.chapter === 'anatomy') ANAT.setSection(U.section === 'sagittal' ? 'sagittal' : 'trans', U.section === 'sagittal' ? 0 : U.sectionX, cam);
      else ANAT.setSection(null);
    }
    // peel window: a sphere around the point under the pointer, on the body's mid-plane
    if (U.peel && U.chapter === 'anatomy' && U.pointer) {
      const ndc = new THREE.Vector2(U.pointer.x / innerWidth * 2 - 1, -(U.pointer.y / innerHeight) * 2 + 1);
      const ray = new THREE.Raycaster(); ray.setFromCamera(ndc, camera);
      const g = cam.group, n = camera.getWorldDirection(new V3()).negate(), c = g.position.clone().setY(1.25 * cam.spec.scale.body);
      const pl = new THREE.Plane().setFromNormalAndCoplanarPoint(n, c), hit = new V3();
      if (ray.ray.intersectPlane(pl, hit) && hit.distanceTo(c) < 1.6) CU.uPeel.value.set(hit.x, hit.y, hit.z, .42); else CU.uPeel.value.w = 0;
    } else CU.uPeel.value.w = 0;
  }
  // camera: follow the walking camel unless the user has taken over
  if (cam && U.follow && (U.chapter === 'movement' || TOURX.on) && performance.now() - U.userT > 3500 && !rig.fly) {
    const tl = U.followT || [0, 1, 0], p = localToWorldPt(tl);
    rig.target.lerp(p, 1 - Math.exp(-2.5 * dt));
    let d = (camelFrame().yaw + (U.followAz || 0)) - rig.theta; d = ((d + Math.PI) % TAU + TAU) % TAU - Math.PI;
    rig.theta += d * (1 - Math.exp(-1.2 * dt));
  }
  rig.update(dt);
  camera.updateMatrixWorld();
  sky.u.uCamInvView.value.copy(camera.matrixWorld); sky.u.uProjInv.value.copy(camera.projectionMatrixInverse); sky.u.uAspect.value = camera.aspect;
  WORLD.updateLight(dt, t);
  FOOT.update(dt, STATE.storm);
  WORLD.dust.update(dt, STATE.storm, rig.target, t);
  WORLD.dust.mat.uniforms.uPR.value = renderer.getPixelRatio();
  WORLD.motes.update(t, rig.target, (1 - STATE.storm) * (ENV.reduce ? .5 : 1));
  WORLD.motes.mat.uniforms.uPR.value = renderer.getPixelRatio();
  HL.apply(t);
  // post: depth of field in close-ups, heat shimmer on hot afternoons
  const pp = post.params;
  pp.aoStrength.value = .7; pp.bloom.value = .035; pp.vignette.value = .16; pp.grain.value = .011;
  // depth of field from the lens: a short telephoto at f/4 separates a close-up from the dunes behind it
  pp.focus.value = rig.r; pp.aperture.value = Q.dof && !ENV.reduce ? Math.min(1.6, .3 * sq(rig.focal / 50) / Math.max(rig.r, .3)) * smooth(9, 3, rig.r) : 0;
  const air = MODEL.air(STATE.hour, STATE.season);
  pp.shimmer.value = STATE.layer === 'thermal' || ENV.reduce ? 0 : smooth(36, 43, air) * smooth(.1, .4, WORLD.sunDir.y) * (1 - STATE.storm);
  post.render(scene, camera, t);
  // interface
  readoutT -= dt;
  if (readoutT <= 0) { readoutT = .12; updateReadout(); }
  updateCallouts(dt);
  if (U.chapter === 'movement') updateGaitCursor();
  INSET.update(dt);
  TOURX.update(dt);
}

async function boot() {
  const bar = $('#ldBar'), step = $('#ldStep');
  const prog = (p, i) => { bar.style.width = (p * 100).toFixed(0) + '%'; if (i != null) step.textContent = tt(UI.ldSteps[i]); };
  const deep = initUI();
  prog(.12, 0);
  const canvas = $('#gl');
  try { renderer = makeRenderer(canvas); }
  catch (e) { $('#ldErr').hidden = false; $('#ldErr').textContent = tt(UI.errGL); bar.parentElement.hidden = true; return; }
  post = new Post(renderer);
  if (Q.name !== 'low') patchSunShadows();
  let texDone = 0;
  const texN = TEX.names.length;
  const texP = TEX.load(() => { texDone++; if (texDone < texN) $('#ldStep').textContent = tt(UI.ldTex) + ' ' + digits(texDone) + '/' + digits(texN); });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, Q.dpr));
  await new Promise(r => setTimeout(r, 20));
  prog(.22, 1);
  await new Promise(r => setTimeout(r, 20));
  WORLD.init();
  onResize();
  rig = new Rig(camera, canvas);
  // tap an organ to open its card
  rig.onTap = e => {
    if (U.chapter !== 'anatomy' || STATE.layer !== 'organs' || !ANAT.built) return;
    const ndc = new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), ray = new THREE.Raycaster();
    ray.setFromCamera(ndc, camera);
    const id = ANAT.pick(ray), aid = id && atlasFor(id);
    if (aid) openOrgan(aid, true);
  };
  prog(.4, 2);
  // the sculpt runs in a worker; the bar follows it (estimated) and the textures (counted)
  let sdfP = 0;
  const tick = setInterval(() => { sdfP = Math.min(1, sdfP + .04); bar.style.width = (40 + 36 * sdfP + 12 * texDone / texN).toFixed(0) + '%'; }, 250);
  try { await WORLD.loadStage('adult'); } catch (e) { clearInterval(tick); $('#ldErr').hidden = false; $('#ldErr').textContent = String(e && e.message || e); return; }
  clearInterval(tick);
  step.textContent = tt(UI.ldSteps[2]);
  await Promise.race([texP, new Promise(r => setTimeout(r, 12000))]);
  prog(.92, 3);
  WORLD.show('adult');
  // an optional photographic model (assets/camel/camel.json → GLB); the procedural camel stays if there is none
  MODEL3D.load(p => { bar.style.width = (92 + 6 * p).toFixed(0) + '%'; }).then(ok => { if (ok && WORLD.camel) MODEL3D.attach(WORLD.camel); });
  // one frame of warm-up so every shader compiles before the reveal
  applyViewOffset();
  U.chapter = deep.chapter;
  go(deep.chapter, deep.topic, { force: true, noHash: true });
  const v = rig.fly ? rig.fly.to : null;
  if (v && !ENV.reduce) { rig.fly = null; rig.target.copy(v.target).add(new V3(0, .4, 0)); rig.r = v.r * 1.9; rig.theta = v.theta - .7; rig.phi = v.phi - .12; rig.flyTo(v, 3.2); }
  prog(1, 4);
  drawDay(true);
  requestAnimationFrame(frame);
  setTimeout(() => $('#loader').classList.add('done'), 350);
  addEventListener('resize', onResize);
  document.addEventListener('visibilitychange', () => { lastT = 0; });
  // warm the other life stages in the background, one at a time
  setTimeout(async () => { for (const s of ['newborn', 'juvenile', 'old']) { try { await WORLD.loadStage(s); } catch (e) { /* stays unavailable */ } } }, 5000);
}
boot();

window.__v = { get rig() { return rig; }, STATE, WORLD, U, post, applyViewOffset, get camera() { return camera; }, fovFor, focalFor, ATM, TEX, CU, MODEL3D, ANAT };

}
</script>
